name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: nebular-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-policy:
    name: Public staging source policy and receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate PR source policy
        env:
          TFSB_BASE_REF: ${{ github.event.pull_request.base.ref }}
          TFSB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TFSB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TFSB_EVENT_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$TFSB_BASE_REF" != "main" ]; then
            echo "::error::Base ref must be main, got $TFSB_BASE_REF"
            exit 1
          fi
          if [ "$TFSB_HEAD_REF" != "staging" ]; then
            echo "::error::Head ref must be staging, got $TFSB_HEAD_REF"
            exit 1
          fi
          if [ "$TFSB_HEAD_REPOSITORY" != "$TFSB_EVENT_REPOSITORY" ]; then
            echo "::error::PR must originate from the same repository, got $TFSB_HEAD_REPOSITORY"
            exit 1
          fi
      - name: Checkout exact staging head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Record staging head receipt
        run: |
          mkdir -p .test-reports/source-policy
          node tools/ci/exact-head.mjs --output .test-reports/source-policy/receipt.json --expected-branch staging --expected-base main --checkout-role staging-head
      - name: Verify explicitly supplied public paired inputs
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const publication = JSON.parse(readFileSync("authenticated-inputs/publication-manifest.json", "utf8"));
          const core = JSON.parse(readFileSync("authenticated-inputs/stellar-binding.json", "utf8"));
          const loom = JSON.parse(readFileSync("authenticated-inputs/loom-binding.json", "utf8"));
          if (publication.schema !== "tfsb.public-paired-inputs-v1") throw new Error("Explicit public paired-input manifest required");
          if (publication.stellar?.status === "release-candidate" || publication.loom?.status === "release-candidate") {
            if (!/^[a-f0-9]{64}$/.test(publication.stellar?.packageSha256 ?? "") || !/^[a-f0-9]{64}$/.test(publication.loom?.packageSha256 ?? "")) throw new Error("Candidate package identities required");
            if (publication.stellar.packageSha256 !== core.package.sha256 || publication.loom.packageSha256 !== loom.sha256) throw new Error("Candidate paired inputs do not match retained candidate packages");
            if (!publication.loom?.catalogBuildEvidenceSha256 && !loom.catalogBuildEvidence?.sha256) throw new Error("Candidate Loom requires catalog build evidence");
            const historical = publication.loom?.history ?? loom.history;
            const hasHistory = Array.isArray(historical) ? historical.some((h) => h.version === "0.1.0" && h.sha256) : (historical?.version === "0.1.0" && historical?.sha256);
            if (!hasHistory) throw new Error("Candidate Loom requires historical 0.1.0 provenance");
          } else {
            for (const product of [publication.stellar, publication.loom]) {
              if (!product || !/^[a-f0-9]{40}$/.test(product.commit) || !/^[a-f0-9]{40}$/.test(product.contentTree) || !/^[a-f0-9]{64}$/.test(product.packageSha256)) throw new Error("Full actual public source and package identities required");
            }
            if (publication.stellar.commit !== core.input.publicMergeCommit || publication.stellar.contentTree !== core.input.sourceTree || publication.stellar.packageSha256 !== core.package.sha256 || publication.loom.packageSha256 !== loom.sha256) throw new Error("Public paired inputs do not match retained candidate packages");
            const source = loom.publicSource;
            const tested = loom.testedProducer;
            if (source?.repository !== "Knowledge-Forge-AI/theme-forge-stellar-loom" || tested?.repository !== source.repository || publication.loom.repository !== source.repository || source?.status !== "published" || source.producerRole !== "durable-main" || publication.loom.commit !== source.commit || publication.loom.contentTree !== source.contentTree || source.contentTree !== tested?.contentTree || tested.packageSha256 !== loom.sha256 || tested.producerRole !== "merge-candidate" || !/^[a-f0-9]{40}$/.test(tested.commit) || !Number.isSafeInteger(tested.runId) || !Number.isSafeInteger(tested.runAttempt) || !Number.isSafeInteger(tested.artifactId) || !/^sha256:[a-f0-9]{64}$/.test(tested.artifactDigest) || !/^[a-f0-9]{64}$/.test(tested.artifactManifestSha256) || JSON.stringify(publication.loom.testedProducer) !== JSON.stringify(tested) || loom.equality?.durableMainAndTestedProducerTreesEqual !== true || loom.equality?.registryAndTestedPackageSha256Equal !== true || JSON.stringify(publication.loom.equality) !== JSON.stringify(loom.equality)) throw new Error("Durable Loom source and tested producer lineage mismatch");
          }
          NODE
      - name: Bind source policy receipt
        run: node tools/ci/artifact-manifest.mjs --root .test-reports/source-policy --output .test-reports/source-policy/artifact-manifest.json --job source-policy --require receipt.json
      - name: Upload source policy receipt
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: source-policy-receipt
          path: .test-reports/source-policy/
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend typecheck, tests, build, and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: source-policy
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.23.3
          cache: npm
      - name: Record exact-head receipt
        run: |
          mkdir -p .test-reports/frontend
          node tools/ci/exact-head.mjs --output .test-reports/frontend/receipt.json --expected-branch staging --expected-base main --checkout-role merge-candidate
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix loom-preview-source --ignore-scripts
      - name: Verify and extract declared Node build types
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { readFileSync, cpSync, mkdtempSync, rmSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          import { extractReleaseArchive } from "./tools/ci/artifact-manifest.mjs";
          const binding = JSON.parse(readFileSync("authenticated-inputs/tooling/binding.json", "utf8"));
          const types = binding.buildTypes;
          const expected = [["@types/node", "22.20.1", "node_modules/@types/node"], ["undici-types", "6.21.0", "node_modules/undici-types"]];
          if (binding.schema !== "tfsb.nebular-verification-tooling-v1" || binding.schemaVersion !== 1 || !types || typeof types.filename !== "string" || !/^[a-z0-9._-]+\.tgz$/i.test(types.filename) || !/^[a-f0-9]{64}$/.test(types.sha256) || !Array.isArray(types.packages) || expected.some(([name, version, prefix]) => !types.packages.some((pkg) => pkg.name === name && pkg.version === version && pkg.prefix === prefix))) throw new Error("invalid declared build-types binding");
          const archive = "authenticated-inputs/tooling-tarball/" + types.filename;
          const digest = createHash("sha256").update(readFileSync(archive)).digest("hex");
          if (digest !== types.sha256) throw new Error("build-types archive digest mismatch");
          const entries = execFileSync("tar", ["-tzf", archive], { encoding: "utf8" }).trim().split("\n");
          if (entries.some((entry) => entry.startsWith("/") || entry.split("/").includes("..")) || expected.some(([, , prefix]) => !entries.includes(prefix + "/package.json"))) throw new Error("build-types archive contents mismatch");
          const scratch = mkdtempSync(join(tmpdir(), "nebular-build-types-"));
          try {
            await extractReleaseArchive({ archivePath: archive, destination: scratch, expectedSha256: types.sha256 });
            for (const [, , path] of expected) cpSync(join(scratch, path), path, { recursive: true });
          } finally { rmSync(scratch, { recursive: true, force: true }); }
          NODE
      - run: node tools/loom-prepare.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Run npm audit with a retained structured report
        run: |
          status=0
          npm audit --json > .test-reports/frontend/npm-audit.json || status=$?
          node -e 'const a = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); console.log(JSON.stringify((a.metadata && a.metadata.vulnerabilities) || a.error || a)); for (const [name, v] of Object.entries(a.vulnerabilities || {})) console.log(name, v.severity, v.range, (v.via || []).map((x) => typeof x === "string" ? x : x.url).join(" "));' .test-reports/frontend/npm-audit.json
          exit "$status"
      - name: Run Loom preview npm audit with a retained structured report
        run: |
          status=0
          npm audit --prefix loom-preview-source --json > .test-reports/frontend/npm-audit-loom-preview.json || status=$?
          node -e 'const a = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); console.log(JSON.stringify((a.metadata && a.metadata.vulnerabilities) || a.error || a)); for (const [name, v] of Object.entries(a.vulnerabilities || {})) console.log(name, v.severity, v.range, (v.via || []).map((x) => typeof x === "string" ? x : x.url).join(" "));' .test-reports/frontend/npm-audit-loom-preview.json
          exit "$status"
      - run: npm run sidecar:test
      - name: Archive frontend release surface
        run: tar -czf .test-reports/frontend/frontend-dist.tar.gz -C dist .
      - name: Bind frontend artifact bytes
        run: node tools/ci/artifact-manifest.mjs --root .test-reports/frontend --output .test-reports/frontend/artifact-manifest.json --job frontend --require receipt.json --require frontend-dist.tar.gz
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: frontend-artifacts
          path: .test-reports/frontend/
          if-no-files-found: error
          retention-days: 14
      - name: Retain frontend audit reports after failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: frontend-audit-${{ github.run_attempt }}
          path: .test-reports/frontend/npm-audit*.json
          if-no-files-found: warn
          retention-days: 14

  macos-arm64:
    name: macOS-arm64 Rust host, Tauri build, and sidecar qualification
    runs-on: macos-15
    timeout-minutes: 45
    needs: source-policy
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.23.3
          cache: npm
      - name: Record exact-head receipt
        run: |
          mkdir -p .test-reports/nebular/node-authenticity
          node tools/ci/exact-head.mjs --output .test-reports/nebular/receipt.json --expected-branch staging --expected-base main --checkout-role merge-candidate
      - name: Select repository-pinned Rust 1.98.0 toolchain
        run: |
          test "$(node -e 'import fs from "node:fs"; const s=fs.readFileSync("rust-toolchain.toml","utf8"); process.stdout.write(s.match(/channel\s*=\s*"([^"]+)"/)[1])')" = "1.98.0"
          CARGO_HOME="$(mktemp -d "${RUNNER_TEMP:-/tmp}/cargo-home.XXXXXX")"
          export CARGO_HOME
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          echo "RUSTUP_TOOLCHAIN=1.98.0" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          RUSTUP_TOOLCHAIN=1.98.0 rustc --version | grep '^rustc 1.98.0 '
          RUSTUP_TOOLCHAIN=1.98.0 cargo --version | grep '^cargo 1.98.0 '
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix loom-preview-source --ignore-scripts
      - run: npm run build
      - name: Verify Node authenticity
        run: |
          node tools/node-runtime-authority.mjs --authenticate-download "$RUNNER_TEMP/node-v22.23.3" --output-node "$RUNNER_TEMP/node-authenticated" --output .test-reports/nebular/node-authenticity/receipt.json
          cp "$RUNNER_TEMP/node-authenticated" .test-reports/nebular/node-runtime
          cp "$RUNNER_TEMP/node-v22.23.3/SHASUMS256.txt.asc" .test-reports/nebular/node-authenticity/
      - name: Build and verify sidecar payload twice
        run: |
          ROOT_TGZ=$(find authenticated-inputs/core-tarball -name '*.tgz' -type f -print -quit)
          test -n "$ROOT_TGZ"
          LOOM_TGZ=$(find authenticated-inputs/loom-tarball -name '*.tgz' -type f -print -quit)
          test -n "$LOOM_TGZ"
          node tools/sidecar-prepare.mjs --node "$RUNNER_TEMP/node-authenticated" --root-tarball "$ROOT_TGZ"
          cp src-tauri/sidecar-payload/manifest.json "$RUNNER_TEMP/manifest-first.json"
          node tools/sidecar-prepare.mjs --node "$RUNNER_TEMP/node-authenticated" --root-tarball "$ROOT_TGZ"
          cmp "$RUNNER_TEMP/manifest-first.json" src-tauri/sidecar-payload/manifest.json
          node tools/loom-prepare.mjs
          if [ -d authenticated-inputs/scene-tarball ]; then
            SCENE_TGZ=$(find authenticated-inputs/scene-tarball -name '*.tgz' -type f -print -quit)
            if [ -n "$SCENE_TGZ" ]; then
              node tools/scene-prepare.mjs prepare "$SCENE_TGZ" "$RUNNER_TEMP/node-authenticated"
              node tools/scene-prepare.mjs verify src-tauri/scene-payload "$RUNNER_TEMP/node-authenticated"
            fi
          fi
          node tools/sidecar-verify.mjs
          tar -czf .test-reports/nebular/sidecar-payload.tar.gz -C src-tauri sidecar-payload
      - name: Execute sidecar protocol transcripts
        run: |
          node tools/sidecar-transcript.mjs > .test-reports/nebular/sidecar-transcript.json
      - name: Fetch locked Rust dependencies for offline notices and qualification
        working-directory: src-tauri
        run: |
          cargo --version | grep '^cargo 1.98.0 '
          cargo fetch --locked --target aarch64-apple-darwin
      - name: Generate and validate mandatory release notices
        run: node tools/release-notices.mjs
      - name: Verify Tauri resource closure
        run: node tools/ci/verify-tauri-resource-closure.mjs --build-ready
      - name: Rust qualification gates
        working-directory: src-tauri
        run: |
          rustc --version | grep '^rustc 1.98.0 '
          cargo --version | grep '^cargo 1.98.0 '
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features -- --test-threads=1
          cargo test --locked --doc
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
      - name: Build macOS Tauri application
        env:
          TFSB_STUDIO_NODE_BINARY: ${{ runner.temp }}/node-authenticated
        run: |
          node --input-type=module -e 'import { createHash } from "node:crypto"; import { readFileSync } from "node:fs"; import { EXPECTED_EXECUTABLE_SHA256 } from "./tools/node-runtime-authority.mjs"; if (createHash("sha256").update(readFileSync(process.env.TFSB_STUDIO_NODE_BINARY)).digest("hex") !== EXPECTED_EXECUTABLE_SHA256) throw new Error("[NODE_AUTH_FAIL] Authenticated Node runtime changed before the Tauri build");'
          # Apple ld records rustup std rlib paths (under the runner home) in its debug map; strip that prefix so build-app's home-path hygiene check applies to real leaks.
          CARGO_ENCODED_RUSTFLAGS="-Clink-arg=-Wl,-oso_prefix,$(rustup show home)/" npm run tauri:build
      # Tauri's beforeBuildCommand rebuilt dist and the application crate embedded exactly those bytes;
      # archive them before any later step so the aggregate cross-check binds the embedded frontend.
      - name: Archive the frontend embedded by the Tauri build
        run: tar -czf .test-reports/nebular/frontend-dist.tar.gz -C dist .
      - name: Verify application bundle and security ACL
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Theme Forge Nebular Fusion.app"
          codesign --force --sign - "$APP"
          node tools/ci/verify-nebular-bundle.mjs --app "$APP" --node "$RUNNER_TEMP/node-authenticated" --payload src-tauri/sidecar-payload --loom-payload src-tauri/loom-payload --output .test-reports/nebular/bundle-identity.json --launch
          node -e 'import { readFileSync, writeFileSync } from "node:fs"; const value = JSON.parse(readFileSync(".test-reports/nebular/bundle-identity.json", "utf8")); writeFileSync(".test-reports/nebular/signing-facts.json", JSON.stringify(value.signing, null, 2) + "\n");'
          tar -czf .test-reports/nebular/nebular-fusion.app.tar.gz -C src-tauri/target/aarch64-apple-darwin/release/bundle/macos "Theme Forge Nebular Fusion.app"
      - name: Bind Nebular artifact bytes
        run: |
          node tools/ci/artifact-manifest.mjs --root .test-reports/nebular --output .test-reports/nebular/artifact-manifest.json --job macos-arm64 --require receipt.json --require node-authenticity/receipt.json --require node-authenticity/SHASUMS256.txt.asc --require node-runtime --require sidecar-payload.tar.gz --require sidecar-transcript.json --require nebular-fusion.app.tar.gz --require frontend-dist.tar.gz --require bundle-identity.json --require signing-facts.json
      - name: Upload Nebular Fusion macOS artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: nebular-macos-arm64-artifacts
          path: .test-reports/nebular/
          if-no-files-found: error
          retention-days: 14

  codeql:
    name: Advanced CodeQL analysis (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: source-policy
    env:
      TFSB_LANGUAGE: ${{ matrix.language }}
      TFSB_MATRIX_JSON: '{"language":"${{ matrix.language }}"}'
      TFSB_CODEQL_REPORT_DIR: .test-reports/codeql-${{ matrix.language }}
    permissions:
      contents: read
      security-events: write # Required by CodeQL analysis upload.
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            os: ubuntu-24.04
          - language: actions
            os: ubuntu-24.04
          - language: rust
            os: macos-15
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.23.3
          cache: npm
      - name: Record exact-head receipt
        run: |
          mkdir -p "$TFSB_CODEQL_REPORT_DIR"
          node tools/ci/exact-head.mjs --output "$TFSB_CODEQL_REPORT_DIR/receipt.json" --expected-branch staging --expected-base main --checkout-role merge-candidate
      - name: Initialize CodeQL Action
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
          output: "${{ env.TFSB_CODEQL_REPORT_DIR }}"
          upload: false
      - name: Retain raw codeql report independently
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: security-codeql-${{ matrix.language }}-raw-${{ github.run_attempt }}
          path: ${{ env.TFSB_CODEQL_REPORT_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Normalize complete codeql findings
        if: ${{ !cancelled() }}
        env:
          TFSB_REPORT_CATEGORY: ${{ matrix.language }}
        run: node tools/ci/security-report.mjs "$TFSB_CODEQL_REPORT_DIR" .test-reports/security-normalized/codeql.json nebular-fusion codeql "$TFSB_REPORT_CATEGORY"
      - name: Retain normalized codeql findings independently
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: security-codeql-${{ matrix.language }}-normalized-${{ github.run_attempt }}
          path: .test-reports/security-normalized/codeql.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Evaluate finding ratchet on CodeQL findings
        if: ${{ !cancelled() }}
        run: node tools/ci/finding-ratchet.mjs --baseline tools/ci/finding-ratchet-baseline.json --input "$TFSB_CODEQL_REPORT_DIR" --product nebular-fusion --tool codeql --check
      - name: Upload CodeQL SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: "${{ env.TFSB_CODEQL_REPORT_DIR }}"
          category: "/language:${{ matrix.language }}"

  supply-chain:
    name: Supply chain, Syft SBOMs, Grype scan, and Cargo audit
    runs-on: macos-15
    timeout-minutes: 40
    needs: source-policy
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.23.3
          cache: npm
      - name: Record exact-head receipt
        run: |
          mkdir -p .test-reports/supply-chain
          node tools/ci/exact-head.mjs --output .test-reports/supply-chain/receipt.json --expected-branch staging --expected-base main --checkout-role merge-candidate
      # Scan the clean checkout before the shipped-input preparation writes generated payloads into it.
      - name: Run selected workflow and secret checks
        run: node tools/ci/run-workflow-checks.mjs --root . --output-dir .test-reports/workflow-checks
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix loom-preview-source --ignore-scripts
      - run: npm run build
      - name: Verify Node authenticity
        run: |
          node tools/node-runtime-authority.mjs --authenticate-download "$RUNNER_TEMP/node-v22.23.3" --output-node "$RUNNER_TEMP/node-authenticated" --output .test-reports/nebular/node-authenticity/receipt.json
          cp "$RUNNER_TEMP/node-authenticated" .test-reports/nebular/node-runtime
          cp "$RUNNER_TEMP/node-v22.23.3/SHASUMS256.txt.asc" .test-reports/nebular/node-authenticity/
      - name: Build and verify sidecar payload twice
        run: |
          ROOT_TGZ=$(find authenticated-inputs/core-tarball -name '*.tgz' -type f -print -quit)
          test -n "$ROOT_TGZ"
          LOOM_TGZ=$(find authenticated-inputs/loom-tarball -name '*.tgz' -type f -print -quit)
          test -n "$LOOM_TGZ"
          node tools/sidecar-prepare.mjs --node "$RUNNER_TEMP/node-authenticated" --root-tarball "$ROOT_TGZ"
          cp src-tauri/sidecar-payload/manifest.json "$RUNNER_TEMP/manifest-first.json"
          node tools/sidecar-prepare.mjs --node "$RUNNER_TEMP/node-authenticated" --root-tarball "$ROOT_TGZ"
          cmp "$RUNNER_TEMP/manifest-first.json" src-tauri/sidecar-payload/manifest.json
          node tools/loom-prepare.mjs
          if [ -d authenticated-inputs/scene-tarball ]; then
            SCENE_TGZ=$(find authenticated-inputs/scene-tarball -name '*.tgz' -type f -print -quit)
            if [ -n "$SCENE_TGZ" ]; then
              node tools/scene-prepare.mjs prepare "$SCENE_TGZ" "$RUNNER_TEMP/node-authenticated"
              node tools/scene-prepare.mjs verify src-tauri/scene-payload "$RUNNER_TEMP/node-authenticated"
            fi
          fi
          node tools/sidecar-verify.mjs
          tar -czf .test-reports/nebular/sidecar-payload.tar.gz -C src-tauri sidecar-payload
      # The macOS job ships the frontend rebuilt by Tauri's beforeBuildCommand after the Loom preview is
      # prepared; rebuild the same way so the scanned distributable is the shipped one.
      - name: Rebuild the shipped frontend with the prepared Loom preview
        run: npm run build
      # release-notices is a bundled resource that no earlier step writes and the checkout does not track;
      # generate it here through the macOS job's maintained notices steps, never scan around it.
      - name: Select repository-pinned Rust 1.98.0 toolchain
        run: |
          test "$(node -e 'import fs from "node:fs"; const s=fs.readFileSync("rust-toolchain.toml","utf8"); process.stdout.write(s.match(/channel\s*=\s*"([^"]+)"/)[1])')" = "1.98.0"
          CARGO_HOME="$(mktemp -d "${RUNNER_TEMP:-/tmp}/cargo-home.XXXXXX")"
          export CARGO_HOME
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          echo "RUSTUP_TOOLCHAIN=1.98.0" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          RUSTUP_TOOLCHAIN=1.98.0 rustc --version | grep '^rustc 1.98.0 '
          RUSTUP_TOOLCHAIN=1.98.0 cargo --version | grep '^cargo 1.98.0 '
      - name: Fetch locked Rust dependencies for offline notices and qualification
        working-directory: src-tauri
        run: |
          cargo --version | grep '^cargo 1.98.0 '
          cargo fetch --locked --target aarch64-apple-darwin
      - name: Generate and validate mandatory release notices
        run: node tools/release-notices.mjs
      - name: Materialize Nebular release surfaces
        run: node tools/supply-chain-surface.mjs materialize --release-dir "$RUNNER_TEMP/tfsb-nebular-release" --inventory-dir "$RUNNER_TEMP/tfsb-nebular-inventory" --report-dir .test-reports/nebular --manifest .test-reports/supply-chain/release-surface.json
      - name: Run Syft SBOM generation and Grype vulnerability scan
        run: |
          TFSB_RELEASE_DIR="$RUNNER_TEMP/tfsb-nebular-release"
          node tools/ci/run-syft-grype.mjs --target "$TFSB_RELEASE_DIR" --output-dir .test-reports/supply-chain --name nebular-fusion             --component-input "shipped-runtime:node=$TFSB_RELEASE_DIR/runtime/catalog"             --component-input "build-input:frontend-lock=$RUNNER_TEMP/tfsb-nebular-inventory/frontend"             --component-input "build-input:rust-lock=$RUNNER_TEMP/tfsb-nebular-inventory/rust"             --component-input "build-input:paired-core=$RUNNER_TEMP/tfsb-nebular-inventory/core"             --component-input "build-input:paired-loom=$RUNNER_TEMP/tfsb-nebular-inventory/loom"             --component-catalogers node=binary-classifier-cataloger             --component-catalogers frontend-lock=javascript-lock-cataloger,javascript-package-cataloger             --component-catalogers rust-lock=rust-cargo-lock-cataloger             --component-catalogers paired-core=javascript-lock-cataloger,javascript-package-cataloger             --component-catalogers paired-loom=javascript-lock-cataloger,javascript-package-cataloger
      - name: Retain raw grype report independently
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: security-grype-supply-chain-raw-${{ github.run_attempt }}
          path: .test-reports/supply-chain/nebular-fusion.grype.sarif
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Normalize complete grype findings
        if: ${{ !cancelled() }}
        env:
          TFSB_REPORT_CATEGORY: supply-chain
        run: node tools/ci/security-report.mjs .test-reports/supply-chain/nebular-fusion.grype.sarif .test-reports/security-normalized/grype.json nebular-fusion grype "$TFSB_REPORT_CATEGORY"
      - name: Retain normalized grype findings independently
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: security-grype-supply-chain-normalized-${{ github.run_attempt }}
          path: .test-reports/security-normalized/grype.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Evaluate finding ratchet on Grype findings
        if: ${{ !cancelled() }}
        run: node tools/ci/finding-ratchet.mjs --baseline tools/ci/finding-ratchet-baseline.json --input .test-reports/supply-chain/nebular-fusion.grype.sarif --product nebular-fusion --tool grype --check
      - name: Retain workflow and secret check outputs
        if: ${{ !cancelled() }}
        run: |
          rm -rf .test-reports/supply-chain/workflow-checks
          if [ -d .test-reports/workflow-checks ]; then mv .test-reports/workflow-checks .test-reports/supply-chain/workflow-checks; fi
          find .test-reports/supply-chain -type f -size 0 -delete
      - name: Run Cargo audit
        run: node tools/ci/run-cargo-audit.mjs --lockfile src-tauri/Cargo.lock --output .test-reports/supply-chain/cargo-audit.json
      - name: Bind supply-chain artifacts
        run: |
          node tools/ci/artifact-manifest.mjs --root .test-reports/supply-chain --output .test-reports/supply-chain/artifact-manifest.json --job supply-chain --require receipt.json --require release-surface.json --require nebular-fusion.syft.json --require nebular-fusion.spdx.json --require nebular-fusion.cdx.json --require nebular-fusion.grype.json --require nebular-fusion.grype.sarif --require nebular-fusion.receipt.json --require workflow-checks/actionlint.result.json --require workflow-checks/zizmor.result.json --require workflow-checks/betterleaks.result.json --require workflow-checks/workflow-checks.receipt.json --require workflow-checks/betterleaks.report.json --require cargo-audit.json
      - name: Upload supply chain artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: supply-chain-artifacts
          path: .test-reports/supply-chain/
          if-no-files-found: error
          retention-days: 14

  evidence-aggregate:
    name: Evidence aggregation and qualification gate
    runs-on: ubuntu-24.04
    if: always()
    env:
      TFSB_NEEDS_JSON: ${{ toJson(needs) }}
    timeout-minutes: 15
    needs:
      - source-policy
      - frontend
      - macos-arm64
      - codeql
      - supply-chain
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.23.3
          cache: npm
      - name: Record exact-head receipt
        run: |
          mkdir -p .test-reports/evidence-aggregate
          node tools/ci/exact-head.mjs --output .test-reports/evidence-aggregate/receipt.json --expected-branch staging --expected-base main --checkout-role merge-candidate
      - name: Download all job artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: .downloaded-artifacts/
      - name: Aggregate evidence and generate qualification manifest
        run: |
          node tools/ci/evidence-aggregator.mjs --download-dir .downloaded-artifacts --output-dir .test-reports/evidence-aggregate --product nebular-fusion --expected-receipt .test-reports/evidence-aggregate/receipt.json --needs-json "$TFSB_NEEDS_JSON"
      - name: Cross-check the supply-chain scan surface against this run's shipped artifacts
        run: node tools/supply-chain-surface.mjs cross-check --download-dir .downloaded-artifacts --output .test-reports/evidence-aggregate/supply-chain-surface-cross-check.json
      - name: Upload evidence aggregate artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: evidence-aggregate-artifacts
          path: .test-reports/evidence-aggregate/
          if-no-files-found: error
          retention-days: 14
