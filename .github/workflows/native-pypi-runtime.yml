name: Public Linux portable runtime for PyPI

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Deprecated compatibility input; must equal the frozen CADB product commit
        default: cadb40c4972f68f314096ff60fbcfb4da950c161
        required: true
        type: string
      runtime_manifest_asset_id:
        description: Immutable GitHub release asset ID for the closed runtime-input manifest
        required: true
        type: string
      runtime_manifest_bytes:
        description: Exact byte size of the closed runtime-input manifest
        required: true
        type: string
      runtime_manifest_sha256:
        description: Exact SHA-256 of the closed runtime-input manifest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nebular-public-pypi-runtime-${{ inputs.source_commit }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  linux:
    name: ${{ matrix.label }} public portable runtime
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux-arm64
            triple: aarch64-unknown-linux-gnu
            scenario: B
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux-x64
            triple: x86_64-unknown-linux-gnu
            scenario: C
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    container:
      image: debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251
      options: --init
    env:
      NEBULAR_PRODUCER_SHA: ${{ github.sha }}
      NEBULAR_SOURCE_INPUT: ${{ inputs.source_commit }}
      NEBULAR_PRODUCT_SOURCE_SHA: cadb40c4972f68f314096ff60fbcfb4da950c161
      NEBULAR_PRODUCT_SOURCE_TREE: 27c643b6375c2aafde314799c4f08e844c14992c
      NEBULAR_RC_SOURCE_SHA: cadb40c4972f68f314096ff60fbcfb4da950c161
      NEBULAR_RC_SOURCE_TREE: 27c643b6375c2aafde314799c4f08e844c14992c
      NEBULAR_RC_PLATFORM: ${{ matrix.platform }}
      NEBULAR_RC_TRIPLE: ${{ matrix.triple }}
      NEBULAR_RC_SCENARIO: ${{ matrix.scenario }}
      NEBULAR_RC_CONTAINER: debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251
      NEBULAR_RUNTIME_MANIFEST_ASSET_ID: ${{ inputs.runtime_manifest_asset_id }}
      NEBULAR_RUNTIME_MANIFEST_BYTES: ${{ inputs.runtime_manifest_bytes }}
      NEBULAR_RUNTIME_MANIFEST_SHA256: ${{ inputs.runtime_manifest_sha256 }}
      DEBIAN_FRONTEND: noninteractive
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"

    steps:
      - name: Install the maintained Linux build and display environment
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends binutils build-essential ca-certificates curl dbus dbus-x11 git libappindicator3-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev patchelf pkg-config procps python3 xauth xvfb xz-utils
          mkdir -p "$RUNNER_TEMP/rc/upload/evidence"
          dpkg-query -W -f '${Package} ${Version} ${Architecture}\n' | sort > "$RUNNER_TEMP/rc/upload/evidence/dpkg-packages.txt"
          echo "NEBULAR_RC_PACKAGES_SHA256=$(sha256sum "$RUNNER_TEMP/rc/upload/evidence/dpkg-packages.txt" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Check out the producer/workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: .producer
          persist-credentials: false

      - name: Check out the frozen product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: cadb40c4972f68f314096ff60fbcfb4da950c161
          fetch-depth: 1
          path: product-source
          persist-credentials: false

      - name: Bind separate producer and product source identities
        env:
          NEBULAR_RC_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export NEBULAR_PRODUCER_ROOT="$GITHUB_WORKSPACE/.producer"
          export NEBULAR_PRODUCT_ROOT="$GITHUB_WORKSPACE/product-source"
          printf '%s' "$NEBULAR_PRODUCER_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$NEBULAR_PRODUCT_SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$NEBULAR_SOURCE_INPUT" = "$NEBULAR_PRODUCT_SOURCE_SHA"
          test "$NEBULAR_RC_REPOSITORY" = "Knowledge-Forge-AI/theme-forge-nebular-fusion"
          test "$(git -C "$NEBULAR_PRODUCER_ROOT" rev-parse HEAD)" = "$NEBULAR_PRODUCER_SHA"
          test "$(git -C "$NEBULAR_PRODUCT_ROOT" rev-parse HEAD)" = "$NEBULAR_PRODUCT_SOURCE_SHA"
          test "$(git -C "$NEBULAR_PRODUCT_ROOT" rev-parse 'HEAD^{tree}')" = "$NEBULAR_PRODUCT_SOURCE_TREE"
          test "$(git -C "$NEBULAR_PRODUCT_ROOT" rev-parse --show-toplevel)" = "$NEBULAR_PRODUCT_ROOT"
          {
            echo "NEBULAR_PRODUCER_TREE=$(git -C "$NEBULAR_PRODUCER_ROOT" rev-parse 'HEAD^{tree}')"
            echo "NEBULAR_RUNTIME_TOOL_SHA256=$(sha256sum "$NEBULAR_PRODUCT_ROOT/tools/native-runtime.mjs" | cut -d' ' -f1)"
            echo "NEBULAR_PRODUCER_ROOT=$NEBULAR_PRODUCER_ROOT"
            echo "NEBULAR_PRODUCT_ROOT=$NEBULAR_PRODUCT_ROOT"
          } >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.23.3

      - name: Validate the public runtime producer contract
        run: node "$NEBULAR_PRODUCER_ROOT/tools/public-pypi-runtime-producer-tests.mjs"

      - name: Run the observational Rust census contract tests
        run: |
          set -euo pipefail
          python3 -m py_compile \
            "$NEBULAR_PRODUCER_ROOT/tools/public-rust-census.py" \
            "$NEBULAR_PRODUCER_ROOT/tools/public-rust-census-metadata.py"
          python3 "$NEBULAR_PRODUCER_ROOT/test/test_public_rust_census.py"
          python3 "$NEBULAR_PRODUCER_ROOT/test/test_public_rust_census_metadata.py"

      - name: Prepare the fresh owned Rust census session
        run: |
          set -euo pipefail
          census_parent="$RUNNER_TEMP/rs9-rust-census"
          census_dir="$census_parent/$NEBULAR_RC_TRIPLE"
          test ! -L "$RUNNER_TEMP"
          test ! -L "$census_parent"
          mkdir -p "$census_dir"
          test ! -L "$census_dir"
          chmod 700 "$census_parent" "$census_dir"
          session="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${NEBULAR_RC_TRIPLE}"
          helper="$NEBULAR_PRODUCER_ROOT/tools/public-rust-census.py"
          metadata_helper="$NEBULAR_PRODUCER_ROOT/tools/public-rust-census-metadata.py"
          test -x "$helper"
          test -f "$metadata_helper"
          {
            echo "NEBULAR_RUSTC_CENSUS_DIR=$census_dir"
            echo "NEBULAR_RUST_CENSUS_SESSION=$session"
            echo "NEBULAR_RUST_CENSUS_HELPER_SHA256=$(sha256sum "$helper" | cut -d' ' -f1)"
            echo "NEBULAR_RUST_CENSUS_METADATA_HELPER_SHA256=$(sha256sum "$metadata_helper" | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Select the repository-pinned Rust 1.98.0 toolchain
        run: |
          set -euo pipefail
          cd "$NEBULAR_PRODUCT_ROOT"
          test "$(node -e 'import fs from "node:fs"; const s=fs.readFileSync("rust-toolchain.toml","utf8"); process.stdout.write(s.match(/channel\s*=\s*"([^"]+)"/)[1])')" = "1.98.0"
          RUSTUP_DIR="$RUNNER_TEMP/rustup-init"
          mkdir -p "$RUSTUP_DIR"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUSTUP_DIR/rustup-init" "https://static.rust-lang.org/rustup/dist/$NEBULAR_RC_TRIPLE/rustup-init"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUSTUP_DIR/rustup-init.sha256" "https://static.rust-lang.org/rustup/dist/$NEBULAR_RC_TRIPLE/rustup-init.sha256"
          test "$(cut -d' ' -f1 "$RUSTUP_DIR/rustup-init.sha256")" = "$(sha256sum "$RUSTUP_DIR/rustup-init" | cut -d' ' -f1)"
          chmod +x "$RUSTUP_DIR/rustup-init"
          export RUSTUP_HOME="$RUNNER_TEMP/rustup" CARGO_HOME="$RUNNER_TEMP/cargo-home"
          "$RUSTUP_DIR/rustup-init" -y --no-modify-path --profile minimal --default-toolchain 1.98.0
          {
            echo "RUSTUP_HOME=$RUSTUP_HOME"
            echo "CARGO_HOME=$CARGO_HOME"
            echo "RUSTUP_TOOLCHAIN=1.98.0"
          } >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          RUSTUP_TOOLCHAIN=1.98.0 rustc --version | grep '^rustc 1.98.0 '
          RUSTUP_TOOLCHAIN=1.98.0 cargo --version | grep '^cargo 1.98.0 '

      - name: Enable observational Rust census for the unchanged product build
        run: |
          set -euo pipefail
          helper="$NEBULAR_PRODUCER_ROOT/tools/public-rust-census.py"
          test -x "$helper"
          echo "RUSTC_WRAPPER=$helper" >> "$GITHUB_ENV"

      - name: Observe the selected Rust compiler and target cfg
        run: |
          set -euo pipefail
          rustc_bin="$(rustup which rustc)"
          test -x "$rustc_bin"
          python3 "$NEBULAR_PRODUCER_ROOT/tools/public-rust-census-metadata.py" probe \
            --rustc "$rustc_bin" \
            --target "$NEBULAR_RC_TRIPLE" \
            --output "$RUNNER_TEMP/rc/upload/evidence/rustc-probe.json"

      - name: Authenticate the embedded Node runtime
        run: |
          set -euo pipefail
          cd "$NEBULAR_PRODUCT_ROOT"
          mkdir -p .test-reports/nebular/node-authenticity
          NODE_DIR="$RUNNER_TEMP/node-linux"
          ARCHIVE=$(node --input-type=module -e 'import { NODE_RELEASE_IDENTITY } from "./tools/node-runtime-authority.mjs"; process.stdout.write(NODE_RELEASE_IDENTITY.targets[process.env.NEBULAR_RC_TRIPLE].archive)')
          mkdir -p "$NODE_DIR"
          curl --proto '=https' --tlsv1.2 -fsSLo "$NODE_DIR/SHASUMS256.txt.asc" https://nodejs.org/dist/v22.23.3/SHASUMS256.txt.asc
          curl --proto '=https' --tlsv1.2 -fsSLo "$NODE_DIR/$ARCHIVE" "https://nodejs.org/dist/v22.23.3/$ARCHIVE"
          node tools/node-runtime-authority.mjs --authenticate-linux "$NODE_DIR" --target "$NEBULAR_RC_TRIPLE" --output-node "$RUNNER_TEMP/node-authenticated" --output .test-reports/nebular/node-authenticity/receipt.json

      - name: Fetch and authenticate the closed runtime-input manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$NEBULAR_PRODUCER_ROOT/tools/public-pypi-runtime-producer.mjs" fetch-manifest \
            --asset-id "$NEBULAR_RUNTIME_MANIFEST_ASSET_ID" \
            --bytes "$NEBULAR_RUNTIME_MANIFEST_BYTES" \
            --sha256 "$NEBULAR_RUNTIME_MANIFEST_SHA256" \
            --output "$RUNNER_TEMP/runtime-manifest.json"

      - name: Fetch and materialize the exact runtime input without product bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-archives/$NEBULAR_RC_TRIPLE" "$RUNNER_TEMP/nebular-runtime"
          node "$NEBULAR_PRODUCER_ROOT/tools/public-pypi-runtime-producer.mjs" runtime-input-args \
            --manifest "$RUNNER_TEMP/runtime-manifest.json" \
            --manifest-sha256 "$NEBULAR_RUNTIME_MANIFEST_SHA256" \
            --target "$NEBULAR_RC_TRIPLE" > "$RUNNER_TEMP/runtime-input-args.json"
          node --input-type=module -e 'import fs from "node:fs"; const args = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const fields = { NEBULAR_RUNTIME_ARCHIVE_NAME: args.archiveName, NEBULAR_RUNTIME_ARCHIVE_BYTES: args.archiveBytes, NEBULAR_RUNTIME_ARCHIVE_SHA256: args.archiveSha256, NEBULAR_RUNTIME_MEMBER_LIST_SHA256: args.expectedMemberListSha256, NEBULAR_RUNTIME_MANIFEST_SHA256_EMBEDDED: args.expectedManifestSha256, NEBULAR_RUNTIME_MATERIAL_SHA256: args.expectedMaterialDigest, NEBULAR_RUNTIME_CORRESPONDING_SOURCE_SHA256: args.correspondingSourceSha256, NEBULAR_RUNTIME_RELEASE_ASSET_SHA256: args.releaseAssetSha256, NEBULAR_RUNTIME_TOOL_SHA256: args.runtimeToolSha256 }; fs.writeFileSync(process.argv[2], Object.entries(fields).map(([key, value]) => key + "=" + value + String.fromCharCode(10)).join(""));' "$RUNNER_TEMP/runtime-input-args.json" "$RUNNER_TEMP/runtime-input-env"
          while IFS= read -r line; do
            key="${line%%=*}"
            value="${line#*=}"
            case "$key" in
              NEBULAR_RUNTIME_ARCHIVE_NAME|NEBULAR_RUNTIME_ARCHIVE_BYTES|NEBULAR_RUNTIME_ARCHIVE_SHA256|NEBULAR_RUNTIME_MEMBER_LIST_SHA256|NEBULAR_RUNTIME_MANIFEST_SHA256_EMBEDDED|NEBULAR_RUNTIME_MATERIAL_SHA256|NEBULAR_RUNTIME_CORRESPONDING_SOURCE_SHA256|NEBULAR_RUNTIME_RELEASE_ASSET_SHA256|NEBULAR_RUNTIME_TOOL_SHA256) printf -v "$key" '%s' "$value" ;;
              *) echo "unexpected runtime input field: $key" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/runtime-input-env"
          cat "$RUNNER_TEMP/runtime-input-env" >> "$GITHUB_ENV"
          node "$NEBULAR_PRODUCER_ROOT/tools/public-pypi-runtime-producer.mjs" fetch-runtime-archive \
            --manifest "$RUNNER_TEMP/runtime-manifest.json" \
            --manifest-sha256 "$NEBULAR_RUNTIME_MANIFEST_SHA256" \
            --target "$NEBULAR_RC_TRIPLE" \
            --output "$RUNNER_TEMP/runtime-archives/$NEBULAR_RC_TRIPLE/$NEBULAR_RUNTIME_ARCHIVE_NAME"
          python3 "$NEBULAR_PRODUCER_ROOT/tools/public-runtime-input.py" \
            --target "$NEBULAR_RC_TRIPLE" \
            --archive "$RUNNER_TEMP/runtime-archives/$NEBULAR_RC_TRIPLE/$NEBULAR_RUNTIME_ARCHIVE_NAME" \
            --expected-archive-bytes "$NEBULAR_RUNTIME_ARCHIVE_BYTES" \
            --expected-archive-sha256 "$NEBULAR_RUNTIME_ARCHIVE_SHA256" \
            --expected-member-list-sha256 "$NEBULAR_RUNTIME_MEMBER_LIST_SHA256" \
            --expected-manifest-sha256 "$NEBULAR_RUNTIME_MANIFEST_SHA256_EMBEDDED" \
            --expected-material-digest "$NEBULAR_RUNTIME_MATERIAL_SHA256" \
            --output "$RUNNER_TEMP/nebular-runtime/$NEBULAR_RC_TRIPLE" \
            --node "$RUNNER_TEMP/node-authenticated" \
            --runtime-tool "$NEBULAR_PRODUCT_ROOT/tools/native-runtime.mjs" \
            --runtime-tool-sha256 "$NEBULAR_RUNTIME_TOOL_SHA256" \
            --corresponding-source-sha256 "$NEBULAR_RUNTIME_CORRESPONDING_SOURCE_SHA256" \
            --release-asset-sha256 "$NEBULAR_RUNTIME_RELEASE_ASSET_SHA256"
          RUNTIME_INPUT="$RUNNER_TEMP/nebular-runtime/$NEBULAR_RC_TRIPLE/input/native-runtime-input.json"
          RUNTIME_INPUT_SHA256=$(node -p 'require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync(process.argv[1])).digest("hex")' "$RUNTIME_INPUT")
          echo "NEBULAR_NATIVE_RUNTIME_INPUT=$RUNTIME_INPUT" >> "$GITHUB_ENV"
          echo "NEBULAR_NATIVE_RUNTIME_INPUT_SHA256=$RUNTIME_INPUT_SHA256" >> "$GITHUB_ENV"

      - name: Bind the public source-origin receipt
        run: |
          set -euo pipefail
          node "$NEBULAR_PRODUCER_ROOT/tools/public-pypi-runtime-producer.mjs" source-origin \
            --manifest "$RUNNER_TEMP/runtime-manifest.json" \
            --manifest-sha256 "$NEBULAR_RUNTIME_MANIFEST_SHA256" \
            --closed "$RUNNER_TEMP/nebular-runtime/$NEBULAR_RC_TRIPLE/runtime-input-closed-manifest.json" \
            --receipt "$RUNNER_TEMP/nebular-runtime/$NEBULAR_RC_TRIPLE/runtime-input-receipt.json" \
            --source-commit "$NEBULAR_RC_SOURCE_SHA" \
            --source-tree "$NEBULAR_RC_SOURCE_TREE" \
            --producer-commit "$NEBULAR_PRODUCER_SHA" \
            --producer-tree "$NEBULAR_PRODUCER_TREE" \
            --output "$RUNNER_TEMP/rc/upload/evidence/source-origin.json"
          echo "NEBULAR_SOURCE_ORIGIN=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1])).identity' "$RUNNER_TEMP/rc/upload/evidence/source-origin.json")" >> "$GITHUB_ENV"

      - name: Install locked frontend dependencies and prepare resources
        run: |
          set -euo pipefail
          cd "$NEBULAR_PRODUCT_ROOT"
          npm ci --ignore-scripts
          npm ci --prefix loom-preview-source --ignore-scripts
          npm run build
          ROOT_TGZ=$(find authenticated-inputs/core-tarball -name '*.tgz' -type f -print -quit)
          test -n "$ROOT_TGZ"
          node tools/sidecar-prepare.mjs --node "$RUNNER_TEMP/node-authenticated" --root-tarball "$ROOT_TGZ" --target "$NEBULAR_RC_TRIPLE"
          cp src-tauri/sidecar-payload/manifest.json "$RUNNER_TEMP/manifest-first.json"
          node tools/sidecar-prepare.mjs --node "$RUNNER_TEMP/node-authenticated" --root-tarball "$ROOT_TGZ" --target "$NEBULAR_RC_TRIPLE"
          cmp "$RUNNER_TEMP/manifest-first.json" src-tauri/sidecar-payload/manifest.json
          node tools/loom-prepare.mjs
          if [ -d authenticated-inputs/scene-tarball ]; then
            SCENE_TGZ=$(find authenticated-inputs/scene-tarball -name '*.tgz' -type f -print -quit)
            if [ -n "$SCENE_TGZ" ]; then
              node tools/scene-prepare.mjs prepare "$SCENE_TGZ" "$RUNNER_TEMP/node-authenticated"
              node tools/scene-prepare.mjs verify src-tauri/scene-payload "$RUNNER_TEMP/node-authenticated"
            fi
          fi
          node tools/sidecar-verify.mjs

      - name: Fetch locked Rust dependencies and generate notices
        run: |
          set -euo pipefail
          cd "$NEBULAR_PRODUCT_ROOT"
          (cd src-tauri && cargo fetch --locked --target "$NEBULAR_RC_TRIPLE")
          node tools/release-notices.mjs
          node tools/ci/verify-tauri-resource-closure.mjs --build-ready --target "$NEBULAR_RC_TRIPLE"

      - name: Build the Linux product with the authenticated portable runtime
        env:
          TFSB_STUDIO_NODE_BINARY: ${{ runner.temp }}/node-authenticated
        run: |
          set -euo pipefail
          cd "$NEBULAR_PRODUCT_ROOT"
          NEBULAR_NATIVE_RUNTIME_INPUT="$NEBULAR_NATIVE_RUNTIME_INPUT" \
          NEBULAR_NATIVE_RUNTIME_INPUT_SHA256="$NEBULAR_NATIVE_RUNTIME_INPUT_SHA256" \
          npm run tauri:build
          RAW=$(find src-tauri/target -type d -path '*/release/bundle/raw' -print -quit)
          test -n "$RAW"
          mkdir -p "$RUNNER_TEMP/rc"
          cp -a "$RAW" "$RUNNER_TEMP/rc/payload"

      - name: Write runtime receipt and qualify the payload
        run: |
          set -euo pipefail
          cd "$NEBULAR_PRODUCT_ROOT"
          mkdir -p "$RUNNER_TEMP/rc/runtime-receipt" "$RUNNER_TEMP/rc/upload/evidence/observations"
          node "$NEBULAR_PRODUCER_ROOT/tools/public-pypi-runtime-producer.mjs" runtime-receipt \
            --target "$NEBULAR_RC_TRIPLE" \
            --payload "$RUNNER_TEMP/rc/payload" \
            --input "$NEBULAR_NATIVE_RUNTIME_INPUT" \
            --input-sha256 "$NEBULAR_NATIVE_RUNTIME_INPUT_SHA256" \
            --source-origin "$RUNNER_TEMP/rc/upload/evidence/source-origin.json" \
            --output "$RUNNER_TEMP/rc/runtime-receipt" \
            --runtime-tool "$NEBULAR_PRODUCT_ROOT/tools/native-runtime.mjs" \
            --runtime-tool-sha256 "$NEBULAR_RUNTIME_TOOL_SHA256"
          cp "$RUNNER_TEMP/rc/runtime-receipt/native-runtime-material.json" "$RUNNER_TEMP/rc/upload/evidence/runtime-receipt.json"
          node tools/native-rc-qualify.mjs \
            --platform "$NEBULAR_RC_PLATFORM" \
            --payload "$RUNNER_TEMP/rc/payload" \
            --checkout "$NEBULAR_PRODUCT_ROOT" \
            --native-runtime "$NEBULAR_NATIVE_RUNTIME_INPUT" \
            --native-runtime-sha256 "$NEBULAR_NATIVE_RUNTIME_INPUT_SHA256" \
            --observation-output-dir "$RUNNER_TEMP/rc/upload/evidence/observations" \
            --source-candidate "$NEBULAR_SOURCE_ORIGIN" \
            --archive-legal-envelope \
            --output "$RUNNER_TEMP/rc/upload/evidence/qualification.json"
          node tools/native-rc-evidence.mjs build-receipt \
            --platform "$NEBULAR_RC_PLATFORM" \
            --checkout "$NEBULAR_PRODUCT_ROOT" \
            --payload "$RUNNER_TEMP/rc/payload" \
            --node-receipt .test-reports/nebular/node-authenticity/receipt.json \
            --npm-cli "$(dirname "$(command -v node)")/../lib/node_modules/npm/bin/npm-cli.js" \
            --source-commit "$NEBULAR_RC_SOURCE_SHA" \
            --output "$RUNNER_TEMP/rc/upload/evidence/build-receipt.json"
          cp "$NEBULAR_PRODUCT_ROOT/.test-reports/nebular/node-authenticity/receipt.json" "$RUNNER_TEMP/rc/upload/evidence/node-authenticity.json"

      - name: Package and verify the exact Linux candidate
        run: |
          set -euo pipefail
          cd "$NEBULAR_PRODUCT_ROOT"
          GLIBC=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).glibcMinimum ?? ""' "$RUNNER_TEMP/rc/upload/evidence/qualification.json")
          node tools/native-rc-package.mjs --platform "$NEBULAR_RC_PLATFORM" --payload "$RUNNER_TEMP/rc/payload" --checkout "$NEBULAR_PRODUCT_ROOT" --output "$RUNNER_TEMP/rc/upload" --npm-cli "$(dirname "$(command -v node)")/../lib/node_modules/npm/bin/npm-cli.js" ${GLIBC:+--glibc-minimum "$GLIBC"}
          mv "$RUNNER_TEMP/rc/upload/package-record.json" "$RUNNER_TEMP/rc/upload/package-manifest.json" "$RUNNER_TEMP/rc/upload/evidence/"
          chmod -R a-w "$RUNNER_TEMP/rc/upload/candidate"

      - name: Smoke-test the packaged candidate from raw and npm bytes
        run: |
          set -euo pipefail
          cd "$NEBULAR_PRODUCT_ROOT"
          RAW=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).raw.filename' "$RUNNER_TEMP/rc/upload/evidence/package-record.json")
          TGZ=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).npm.filename' "$RUNNER_TEMP/rc/upload/evidence/package-record.json")
          MANIFEST=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).packageManifestSha256' "$RUNNER_TEMP/rc/upload/evidence/package-record.json")
          mkdir -p "$RUNNER_TEMP/rc/smoke/raw" "$RUNNER_TEMP/rc/smoke/npm" "$RUNNER_TEMP/rc/upload/evidence/smoke"
          tar -xzf "$RUNNER_TEMP/rc/upload/candidate/$RAW" -C "$RUNNER_TEMP/rc/smoke/raw"
          tar -xzf "$RUNNER_TEMP/rc/upload/candidate/$TGZ" -C "$RUNNER_TEMP/rc/smoke/npm"
          node tools/native-rc-package.mjs verify --platform "$NEBULAR_RC_PLATFORM" --package-root "$RUNNER_TEMP/rc/smoke/npm/package" --manifest-sha256 "$MANIFEST"
          RAW_ROOT=$(find "$RUNNER_TEMP/rc/smoke/raw" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$RAW_ROOT"
          NPM_ROOT="$RUNNER_TEMP/rc/smoke/npm/package/payload"
          run_smoke() {
            xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- node tools/native-rc-smoke.mjs --platform "$NEBULAR_RC_PLATFORM" --scenario "$1" --launch-root "$2" --checkout "$NEBULAR_PRODUCT_ROOT" --evidence "$RUNNER_TEMP/rc/upload/evidence/smoke" --source "$3" --label "$NEBULAR_RC_PLATFORM-$1-$3" --package-manifest-sha256 "$MANIFEST"
          }
          run_smoke "$NEBULAR_RC_SCENARIO" "$RAW_ROOT" raw-archive
          if [ "$NEBULAR_RC_SCENARIO" = C ]; then
            run_smoke C-signal "$NPM_ROOT" npm-package
          else
            run_smoke B "$NPM_ROOT" npm-package
          fi

      - name: Write the public PyPI intake release receipt
        run: |
          set -euo pipefail
          node "$NEBULAR_PRODUCER_ROOT/tools/public-pypi-runtime-producer.mjs" release-receipt \
            --platform "$NEBULAR_RC_PLATFORM" \
            --source-origin "$RUNNER_TEMP/rc/upload/evidence/source-origin.json" \
            --runtime-receipt "$RUNNER_TEMP/rc/upload/evidence/runtime-receipt.json" \
            --qualification "$RUNNER_TEMP/rc/upload/evidence/qualification.json" \
            --build-receipt "$RUNNER_TEMP/rc/upload/evidence/build-receipt.json" \
            --package-record "$RUNNER_TEMP/rc/upload/evidence/package-record.json" \
            --package-manifest "$RUNNER_TEMP/rc/upload/evidence/package-manifest.json" \
            --smoke-dir "$RUNNER_TEMP/rc/upload/evidence/smoke" \
            --output "$RUNNER_TEMP/rc/upload/evidence/public-pypi-runtime-release.json"

      - name: Aggregate the fresh observational Rust census
        run: |
          set -euo pipefail
          metadata_helper="$NEBULAR_PRODUCER_ROOT/tools/public-rust-census-metadata.py"
          census_helper="$NEBULAR_PRODUCER_ROOT/tools/public-rust-census.py"
          metadata="$RUNNER_TEMP/rc/upload/evidence/rust-census-metadata.json"
          python3 "$metadata_helper" metadata \
            --source-origin "$RUNNER_TEMP/rc/upload/evidence/source-origin.json" \
            --build-receipt "$RUNNER_TEMP/rc/upload/evidence/build-receipt.json" \
            --package-record "$RUNNER_TEMP/rc/upload/evidence/package-record.json" \
            --qualification "$RUNNER_TEMP/rc/upload/evidence/qualification.json" \
            --probe "$RUNNER_TEMP/rc/upload/evidence/rustc-probe.json" \
            --product-commit "$NEBULAR_PRODUCT_SOURCE_SHA" \
            --product-tree "$NEBULAR_PRODUCT_SOURCE_TREE" \
            --producer-commit "$NEBULAR_PRODUCER_SHA" \
            --producer-tree "$NEBULAR_PRODUCER_TREE" \
            --platform "$NEBULAR_RC_PLATFORM" \
            --triple "$NEBULAR_RC_TRIPLE" \
            --output "$metadata"
          python3 "$census_helper" aggregate \
            --records "$NEBULAR_RUSTC_CENSUS_DIR" \
            --metadata "$metadata" \
            --session "$NEBULAR_RUST_CENSUS_SESSION" \
            --output "$RUNNER_TEMP/rc/upload/evidence/rust-census.json"

      - name: Upload the qualified Linux PyPI intake candidate
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nebular-public-pypi-runtime-${{ matrix.triple }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc/upload/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false

      - name: Retain bounded diagnostics after a failed lane
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nebular-public-pypi-runtime-${{ matrix.triple }}-${{ github.run_id }}-diagnostics
          path: ${{ runner.temp }}/rc/upload/evidence/
          if-no-files-found: warn
          retention-days: 14
          overwrite: false

      - name: Restore runner write access for cleanup
        if: ${{ always() }}
        run: chmod -R u+w "$RUNNER_TEMP/rc" 2>/dev/null || true
