name: Native release candidates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/native-rc.yml"
      - "authenticated-inputs/**"
      - "docs/examples/v0.4/brand-system/core-minimal/**"
      - "gallery/**"
      - "index.html"
      - "LICENSE"
      - "loom-preview-source/**"
      - "native-source-inventory.json"
      - "native/**"
      - "NOTICE"
      - "package-lock.json"
      - "package.json"
      - "protocol/**"
      - "rust-toolchain.toml"
      - "src-tauri/**"
      - "src/**"
      - "tools/**"
      - "tsconfig.json"
      - "vite.config.ts"
  workflow_dispatch:
    inputs:
      macos_arm64:
        description: Build, qualify and smoke-test the macOS Apple Silicon candidate
        type: boolean
        default: false
      linux_arm64:
        description: Build, qualify and smoke-test the Linux arm64 candidate
        type: boolean
        default: false
      linux_x64:
        description: Build, qualify and smoke-test the Linux x64 candidate
        type: boolean
        default: false
      release_candidate:
        description: Retain passing candidates for 90 days (the public maximum) instead of 14
        type: boolean
        default: false
      linux_closure:
        description: Run the Linux ELF closure and pinned glibc consumer diagnostic (no release claim)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nebular-native-rc-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select native release-candidate lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      retention_days: ${{ steps.plan.outputs.retention_days }}
      diagnostics_retention_days: ${{ steps.plan.outputs.diagnostics_retention_days }}
      macos_arm64: ${{ steps.plan.outputs.macos_arm64 }}
      macos_arm64_artifact: ${{ steps.plan.outputs.macos_arm64_artifact }}
      macos_arm64_diagnostics: ${{ steps.plan.outputs.macos_arm64_diagnostics }}
      linux_arm64: ${{ steps.plan.outputs.linux_arm64 }}
      linux_arm64_artifact: ${{ steps.plan.outputs.linux_arm64_artifact }}
      linux_arm64_diagnostics: ${{ steps.plan.outputs.linux_arm64_diagnostics }}
      linux_x64: ${{ steps.plan.outputs.linux_x64 }}
      linux_x64_artifact: ${{ steps.plan.outputs.linux_x64_artifact }}
      linux_x64_diagnostics: ${{ steps.plan.outputs.linux_x64_diagnostics }}
    steps:
      - name: Check out the exact reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.23.3
      - name: Select lanes, names and retention
        id: plan
        env:
          NEBULAR_RC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/native-rc-plan.mjs

  macos-arm64:
    name: macOS arm64 release candidate (scenario A)
    needs: plan
    if: needs.plan.outputs.macos_arm64 == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      evidence_sha256: ${{ steps.seal.outputs.evidence_sha256 }}
    env:
      NEBULAR_RC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NEBULAR_RC_PLATFORM: darwin-arm64
      NEBULAR_RC_TRIPLE: aarch64-apple-darwin
      NEBULAR_RC_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: Check out the exact reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      # A pull-request candidate is the head commit, and its tree must be exactly the tree that merges.
      - name: Bind the source commit and tree
        env:
          NEBULAR_RC_EVENT: ${{ github.event_name }}
          NEBULAR_RC_MERGE_SHA: ${{ github.sha }}
          NEBULAR_RC_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          NEBULAR_RC_REPOSITORY: ${{ github.repository }}
        run: |
          test "$(git rev-parse HEAD)" = "$NEBULAR_RC_SOURCE_SHA"
          echo "NEBULAR_RC_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
          if [ "$NEBULAR_RC_EVENT" = "pull_request" ]; then
            test "$NEBULAR_RC_HEAD_REPOSITORY" = "$NEBULAR_RC_REPOSITORY"
            git fetch --no-tags --depth=1 origin "$NEBULAR_RC_MERGE_SHA"
            test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')"
            {
              echo "NEBULAR_RC_MERGE_COMMIT=$NEBULAR_RC_MERGE_SHA"
              echo "NEBULAR_RC_MERGE_TREE=$(git rev-parse 'FETCH_HEAD^{tree}')"
            } >> "$GITHUB_ENV"
          fi
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.23.3
      - name: Select the repository-pinned Rust 1.98.0 toolchain
        run: |
          test "$(node -e 'import fs from "node:fs"; const s=fs.readFileSync("rust-toolchain.toml","utf8"); process.stdout.write(s.match(/channel\s*=\s*"([^"]+)"/)[1])')" = "1.98.0"
          CARGO_HOME="$(mktemp -d "${RUNNER_TEMP:-/tmp}/cargo-home.XXXXXX")"
          export CARGO_HOME
          rustup toolchain install 1.98.0 --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.98.0" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          RUSTUP_TOOLCHAIN=1.98.0 rustc --version | grep '^rustc 1.98.0 '
          RUSTUP_TOOLCHAIN=1.98.0 cargo --version | grep '^cargo 1.98.0 '
      - name: Authenticate the embedded Node runtime
        run: |
          mkdir -p .test-reports/nebular/node-authenticity
          node tools/node-runtime-authority.mjs --authenticate-download "$RUNNER_TEMP/node-v22.23.3" --output-node "$RUNNER_TEMP/node-authenticated" --output .test-reports/nebular/node-authenticity/receipt.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix loom-preview-source --ignore-scripts
      - run: npm run build
      - name: Build and verify sidecar, Loom and scene payloads
        run: |
          ROOT_TGZ=$(find authenticated-inputs/core-tarball -name '*.tgz' -type f -print -quit)
          test -n "$ROOT_TGZ"
          node tools/sidecar-prepare.mjs --node "$RUNNER_TEMP/node-authenticated" --root-tarball "$ROOT_TGZ" --target "$NEBULAR_RC_TRIPLE"
          cp src-tauri/sidecar-payload/manifest.json "$RUNNER_TEMP/manifest-first.json"
          node tools/sidecar-prepare.mjs --node "$RUNNER_TEMP/node-authenticated" --root-tarball "$ROOT_TGZ" --target "$NEBULAR_RC_TRIPLE"
          cmp "$RUNNER_TEMP/manifest-first.json" src-tauri/sidecar-payload/manifest.json
          node tools/loom-prepare.mjs
          if [ -d authenticated-inputs/scene-tarball ]; then
            SCENE_TGZ=$(find authenticated-inputs/scene-tarball -name '*.tgz' -type f -print -quit)
            if [ -n "$SCENE_TGZ" ]; then
              node tools/scene-prepare.mjs prepare "$SCENE_TGZ" "$RUNNER_TEMP/node-authenticated"
              node tools/scene-prepare.mjs verify src-tauri/scene-payload "$RUNNER_TEMP/node-authenticated"
            fi
          fi
          node tools/sidecar-verify.mjs
      - name: Fetch locked Rust dependencies and generate release notices
        run: |
          (cd src-tauri && cargo fetch --locked --target "$NEBULAR_RC_TRIPLE")
          node tools/release-notices.mjs
          node tools/ci/verify-tauri-resource-closure.mjs --build-ready --target "$NEBULAR_RC_TRIPLE"
      - name: Compile the native release payload
        env:
          TFSB_STUDIO_NODE_BINARY: ${{ runner.temp }}/node-authenticated
        run: |
          # Apple ld records rustup std rlib paths (under the runner home) in its debug map; strip that prefix so build-app's home-path hygiene check applies to real leaks.
          CARGO_ENCODED_RUSTFLAGS="-Clink-arg=-Wl,-oso_prefix,$(rustup show home)/" npm run tauri:build
          mkdir -p "$RUNNER_TEMP/rc/payload"
          ditto --norsrc --noextattr --noacl "src-tauri/target/$NEBULAR_RC_TRIPLE/release/bundle/macos/Theme Forge Nebular Fusion.app" "$RUNNER_TEMP/rc/payload/Theme Forge Nebular Fusion.app"
      - name: Qualify the native payload
        run: |
          mkdir -p "$RUNNER_TEMP/rc/upload/evidence"
          node tools/native-rc-qualify.mjs --platform "$NEBULAR_RC_PLATFORM" --payload "$RUNNER_TEMP/rc/payload" --checkout . --output "$RUNNER_TEMP/rc/upload/evidence/qualification.json"
          node tools/native-rc-evidence.mjs build-receipt --platform "$NEBULAR_RC_PLATFORM" --checkout . --payload "$RUNNER_TEMP/rc/payload" --node-receipt .test-reports/nebular/node-authenticity/receipt.json --npm-cli "$(dirname "$(command -v node)")/../lib/node_modules/npm/bin/npm-cli.js" --source-commit "$NEBULAR_RC_SOURCE_SHA" ${NEBULAR_RC_MERGE_COMMIT:+--merge-commit "$NEBULAR_RC_MERGE_COMMIT" --merge-tree "$NEBULAR_RC_MERGE_TREE"} --output "$RUNNER_TEMP/rc/upload/evidence/build-receipt.json"
          cp .test-reports/nebular/node-authenticity/receipt.json "$RUNNER_TEMP/rc/upload/evidence/node-authenticity.json"
      - name: Package the exact candidate bytes
        run: |
          GLIBC=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).glibcMinimum ?? ""' "$RUNNER_TEMP/rc/upload/evidence/qualification.json")
          node tools/native-rc-package.mjs --platform "$NEBULAR_RC_PLATFORM" --payload "$RUNNER_TEMP/rc/payload" --checkout . --output "$RUNNER_TEMP/rc/upload" --npm-cli "$(dirname "$(command -v node)")/../lib/node_modules/npm/bin/npm-cli.js" ${GLIBC:+--glibc-minimum "$GLIBC"}
          mv "$RUNNER_TEMP/rc/upload/package-record.json" "$RUNNER_TEMP/rc/upload/package-manifest.json" "$RUNNER_TEMP/rc/upload/evidence/"
          chmod -R a-w "$RUNNER_TEMP/rc/upload/candidate"
      # Smoke runs read the read-only candidate files only: each scenario is launched once from the
      # extracted raw archive and once from the extracted npm package.
      - name: Smoke-test the exact packaged candidate
        run: |
          set -e
          RAW=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).raw.filename' "$RUNNER_TEMP/rc/upload/evidence/package-record.json")
          TGZ=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).npm.filename' "$RUNNER_TEMP/rc/upload/evidence/package-record.json")
          MANIFEST=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).packageManifestSha256' "$RUNNER_TEMP/rc/upload/evidence/package-record.json")
          mkdir -p "$RUNNER_TEMP/rc/smoke/raw" "$RUNNER_TEMP/rc/smoke/npm" "$RUNNER_TEMP/rc/upload/evidence/smoke"
          tar -xzf "$RUNNER_TEMP/rc/upload/candidate/$RAW" -C "$RUNNER_TEMP/rc/smoke/raw"
          tar -xzf "$RUNNER_TEMP/rc/upload/candidate/$TGZ" -C "$RUNNER_TEMP/rc/smoke/npm"
          node tools/native-rc-package.mjs verify --platform "$NEBULAR_RC_PLATFORM" --package-root "$RUNNER_TEMP/rc/smoke/npm/package" --manifest-sha256 "$MANIFEST"
          RAW_ROOT="$RUNNER_TEMP/rc/smoke/raw"
          NPM_ROOT="$RUNNER_TEMP/rc/smoke/npm/package/payload"
          run_smoke() {
            node tools/native-rc-smoke.mjs --platform "$NEBULAR_RC_PLATFORM" --scenario "$1" --launch-root "$2" --checkout . --evidence "$RUNNER_TEMP/rc/upload/evidence/smoke" --source "$3" --label "$NEBULAR_RC_PLATFORM-$1-$3"
          }
          run_smoke A "$RAW_ROOT" raw-archive
          run_smoke A "$NPM_ROOT" npm-package
      - name: Seal the candidate identity chain
        id: seal
        run: |
          printf '%s' "$NEBULAR_RC_PLAN" > "$RUNNER_TEMP/rc/upload/evidence/plan.json"
          node tools/native-rc-evidence.mjs seal --lane macos-arm64 --plan "$RUNNER_TEMP/rc/upload/evidence/plan.json" --candidate-dir "$RUNNER_TEMP/rc/upload/candidate" --package-record "$RUNNER_TEMP/rc/upload/evidence/package-record.json" --package-manifest "$RUNNER_TEMP/rc/upload/evidence/package-manifest.json" --qualification "$RUNNER_TEMP/rc/upload/evidence/qualification.json" --smoke-dir "$RUNNER_TEMP/rc/upload/evidence/smoke" --build-receipt "$RUNNER_TEMP/rc/upload/evidence/build-receipt.json" --output "$RUNNER_TEMP/rc/upload/evidence/rc-evidence.json"
          echo "evidence_sha256=$(node -p 'require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync(process.argv[1])).digest("hex")' "$RUNNER_TEMP/rc/upload/evidence/rc-evidence.json")" >> "$GITHUB_OUTPUT"
      # Upload immediately after the seal: the candidate files are the smoke-tested bytes, unchanged.
      - name: Upload the qualified candidate and its evidence
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.plan.outputs.macos_arm64_artifact }}
          path: ${{ runner.temp }}/rc/upload/
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.retention_days }}
          compression-level: 0
          overwrite: false
      - name: Restore write access for runner cleanup
        if: ${{ always() }}
        run: chmod -R u+w "$RUNNER_TEMP/rc" 2>/dev/null || true
      - name: Retain diagnostics without candidate binaries
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.plan.outputs.macos_arm64_diagnostics }}
          path: ${{ runner.temp }}/rc/upload/evidence/
          if-no-files-found: warn
          retention-days: ${{ needs.plan.outputs.diagnostics_retention_days }}
          overwrite: false

  linux-arm64:
    name: Linux arm64 release candidate (scenario B)
    needs: plan
    if: needs.plan.outputs.linux_arm64 == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    container:
      image: debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251
      options: --init
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      evidence_sha256: ${{ steps.seal.outputs.evidence_sha256 }}
    env:
      NEBULAR_RC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NEBULAR_RC_PLATFORM: linux-arm64
      NEBULAR_RC_TRIPLE: aarch64-unknown-linux-gnu
      NEBULAR_RC_PLAN: ${{ needs.plan.outputs.plan }}
      NEBULAR_RC_CONTAINER: debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251
      DEBIAN_FRONTEND: noninteractive
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
    steps:
      - name: Install the build and virtual display environment
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils build-essential ca-certificates curl dbus dbus-x11 git libappindicator3-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev patchelf pkg-config procps xauth xvfb xz-utils
          mkdir -p "$RUNNER_TEMP/rc/upload/evidence"
          dpkg-query -W -f '${Package} ${Version} ${Architecture}\n' | sort > "$RUNNER_TEMP/rc/upload/evidence/dpkg-packages.txt"
          echo "NEBULAR_RC_PACKAGES_SHA256=$(sha256sum "$RUNNER_TEMP/rc/upload/evidence/dpkg-packages.txt" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Check out the exact reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Trust exactly this job's workspace for Git
        run: |
          case "$GITHUB_WORKSPACE" in /*) ;; *) echo "::error::GITHUB_WORKSPACE is not absolute"; exit 1 ;; esac
          case "$GITHUB_WORKSPACE" in *'*'*) echo "::error::GITHUB_WORKSPACE contains a wildcard"; exit 1 ;; esac
          test "$(pwd -P)" = "$GITHUB_WORKSPACE"
          test -d "$GITHUB_WORKSPACE/.git"
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git config --show-origin --get-all safe.directory
          test -z "$(git config --get-all safe.directory | grep -Fxv -e "$GITHUB_WORKSPACE" || true)"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
      # A pull-request candidate is the head commit, and its tree must be exactly the tree that merges.
      - name: Bind the source commit and tree
        env:
          NEBULAR_RC_EVENT: ${{ github.event_name }}
          NEBULAR_RC_MERGE_SHA: ${{ github.sha }}
          NEBULAR_RC_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          NEBULAR_RC_REPOSITORY: ${{ github.repository }}
        run: |
          test "$(git rev-parse HEAD)" = "$NEBULAR_RC_SOURCE_SHA"
          echo "NEBULAR_RC_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
          if [ "$NEBULAR_RC_EVENT" = "pull_request" ]; then
            test "$NEBULAR_RC_HEAD_REPOSITORY" = "$NEBULAR_RC_REPOSITORY"
            git fetch --no-tags --depth=1 origin "$NEBULAR_RC_MERGE_SHA"
            test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')"
            {
              echo "NEBULAR_RC_MERGE_COMMIT=$NEBULAR_RC_MERGE_SHA"
              echo "NEBULAR_RC_MERGE_TREE=$(git rev-parse 'FETCH_HEAD^{tree}')"
            } >> "$GITHUB_ENV"
          fi
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.23.3
      - name: Select the repository-pinned Rust 1.98.0 toolchain
        run: |
          test "$(node -e 'import fs from "node:fs"; const s=fs.readFileSync("rust-toolchain.toml","utf8"); process.stdout.write(s.match(/channel\s*=\s*"([^"]+)"/)[1])')" = "1.98.0"
          RUSTUP_DIR="$RUNNER_TEMP/rustup-init"
          mkdir -p "$RUSTUP_DIR"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUSTUP_DIR/rustup-init" "https://static.rust-lang.org/rustup/dist/$NEBULAR_RC_TRIPLE/rustup-init"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUSTUP_DIR/rustup-init.sha256" "https://static.rust-lang.org/rustup/dist/$NEBULAR_RC_TRIPLE/rustup-init.sha256"
          test "$(cut -d' ' -f1 "$RUSTUP_DIR/rustup-init.sha256")" = "$(sha256sum "$RUSTUP_DIR/rustup-init" | cut -d' ' -f1)"
          chmod +x "$RUSTUP_DIR/rustup-init"
          export RUSTUP_HOME="$RUNNER_TEMP/rustup" CARGO_HOME="$RUNNER_TEMP/cargo-home"
          "$RUSTUP_DIR/rustup-init" -y --no-modify-path --profile minimal --default-toolchain 1.98.0
          {
            echo "RUSTUP_HOME=$RUSTUP_HOME"
            echo "CARGO_HOME=$CARGO_HOME"
            echo "RUSTUP_TOOLCHAIN=1.98.0"
          } >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          RUSTUP_TOOLCHAIN=1.98.0 rustc --version | grep '^rustc 1.98.0 '
          RUSTUP_TOOLCHAIN=1.98.0 cargo --version | grep '^cargo 1.98.0 '
      - name: Authenticate the embedded Node runtime
        run: |
          mkdir -p .test-reports/nebular/node-authenticity
          NODE_DIR="$RUNNER_TEMP/node-linux"
          ARCHIVE=$(node --input-type=module -e 'import { NODE_RELEASE_IDENTITY } from "./tools/node-runtime-authority.mjs"; process.stdout.write(NODE_RELEASE_IDENTITY.targets[process.env.NEBULAR_RC_TRIPLE].archive)')
          mkdir -p "$NODE_DIR"
          curl --proto '=https' --tlsv1.2 -fsSLo "$NODE_DIR/SHASUMS256.txt.asc" https://nodejs.org/dist/v22.23.3/SHASUMS256.txt.asc
          curl --proto '=https' --tlsv1.2 -fsSLo "$NODE_DIR/$ARCHIVE" "https://nodejs.org/dist/v22.23.3/$ARCHIVE"
          node tools/node-runtime-authority.mjs --authenticate-linux "$NODE_DIR" --target "$NEBULAR_RC_TRIPLE" --output-node "$RUNNER_TEMP/node-authenticated" --output .test-reports/nebular/node-authenticity/receipt.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix loom-preview-source --ignore-scripts
      - run: npm run build
      - name: Build and verify sidecar, Loom and scene payloads
        run: |
          ROOT_TGZ=$(find authenticated-inputs/core-tarball -name '*.tgz' -type f -print -quit)
          test -n "$ROOT_TGZ"
          node tools/sidecar-prepare.mjs --node "$RUNNER_TEMP/node-authenticated" --root-tarball "$ROOT_TGZ" --target "$NEBULAR_RC_TRIPLE"
          cp src-tauri/sidecar-payload/manifest.json "$RUNNER_TEMP/manifest-first.json"
          node tools/sidecar-prepare.mjs --node "$RUNNER_TEMP/node-authenticated" --root-tarball "$ROOT_TGZ" --target "$NEBULAR_RC_TRIPLE"
          cmp "$RUNNER_TEMP/manifest-first.json" src-tauri/sidecar-payload/manifest.json
          node tools/loom-prepare.mjs
          if [ -d authenticated-inputs/scene-tarball ]; then
            SCENE_TGZ=$(find authenticated-inputs/scene-tarball -name '*.tgz' -type f -print -quit)
            if [ -n "$SCENE_TGZ" ]; then
              node tools/scene-prepare.mjs prepare "$SCENE_TGZ" "$RUNNER_TEMP/node-authenticated"
              node tools/scene-prepare.mjs verify src-tauri/scene-payload "$RUNNER_TEMP/node-authenticated"
            fi
          fi
          node tools/sidecar-verify.mjs
      - name: Fetch locked Rust dependencies and generate release notices
        run: |
          (cd src-tauri && cargo fetch --locked --target "$NEBULAR_RC_TRIPLE")
          node tools/release-notices.mjs
          node tools/ci/verify-tauri-resource-closure.mjs --build-ready --target "$NEBULAR_RC_TRIPLE"
      - name: Compile the native release payload
        env:
          TFSB_STUDIO_NODE_BINARY: ${{ runner.temp }}/node-authenticated
        run: |
          npm run tauri:build
          RAW=$(find src-tauri/target -type d -path '*/release/bundle/raw' -print -quit)
          test -n "$RAW"
          mkdir -p "$RUNNER_TEMP/rc"
          cp -a "$RAW" "$RUNNER_TEMP/rc/payload"
      - name: Qualify the native payload
        run: |
          mkdir -p "$RUNNER_TEMP/rc/upload/evidence"
          node tools/native-rc-qualify.mjs --platform "$NEBULAR_RC_PLATFORM" --payload "$RUNNER_TEMP/rc/payload" --checkout . --output "$RUNNER_TEMP/rc/upload/evidence/qualification.json"
          node tools/native-rc-evidence.mjs build-receipt --platform "$NEBULAR_RC_PLATFORM" --checkout . --payload "$RUNNER_TEMP/rc/payload" --node-receipt .test-reports/nebular/node-authenticity/receipt.json --npm-cli "$(dirname "$(command -v node)")/../lib/node_modules/npm/bin/npm-cli.js" --source-commit "$NEBULAR_RC_SOURCE_SHA" ${NEBULAR_RC_MERGE_COMMIT:+--merge-commit "$NEBULAR_RC_MERGE_COMMIT" --merge-tree "$NEBULAR_RC_MERGE_TREE"} --output "$RUNNER_TEMP/rc/upload/evidence/build-receipt.json"
          cp .test-reports/nebular/node-authenticity/receipt.json "$RUNNER_TEMP/rc/upload/evidence/node-authenticity.json"
      - name: Package the exact candidate bytes
        run: |
          GLIBC=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).glibcMinimum ?? ""' "$RUNNER_TEMP/rc/upload/evidence/qualification.json")
          node tools/native-rc-package.mjs --platform "$NEBULAR_RC_PLATFORM" --payload "$RUNNER_TEMP/rc/payload" --checkout . --output "$RUNNER_TEMP/rc/upload" --npm-cli "$(dirname "$(command -v node)")/../lib/node_modules/npm/bin/npm-cli.js" ${GLIBC:+--glibc-minimum "$GLIBC"}
          mv "$RUNNER_TEMP/rc/upload/package-record.json" "$RUNNER_TEMP/rc/upload/package-manifest.json" "$RUNNER_TEMP/rc/upload/evidence/"
          chmod -R a-w "$RUNNER_TEMP/rc/upload/candidate"
      # Smoke runs read the read-only candidate files only: each scenario is launched once from the
      # extracted raw archive and once from the extracted npm package.
      - name: Smoke-test the exact packaged candidate
        run: |
          set -e
          RAW=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).raw.filename' "$RUNNER_TEMP/rc/upload/evidence/package-record.json")
          TGZ=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).npm.filename' "$RUNNER_TEMP/rc/upload/evidence/package-record.json")
          MANIFEST=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).packageManifestSha256' "$RUNNER_TEMP/rc/upload/evidence/package-record.json")
          mkdir -p "$RUNNER_TEMP/rc/smoke/raw" "$RUNNER_TEMP/rc/smoke/npm" "$RUNNER_TEMP/rc/upload/evidence/smoke"
          tar -xzf "$RUNNER_TEMP/rc/upload/candidate/$RAW" -C "$RUNNER_TEMP/rc/smoke/raw"
          tar -xzf "$RUNNER_TEMP/rc/upload/candidate/$TGZ" -C "$RUNNER_TEMP/rc/smoke/npm"
          node tools/native-rc-package.mjs verify --platform "$NEBULAR_RC_PLATFORM" --package-root "$RUNNER_TEMP/rc/smoke/npm/package" --manifest-sha256 "$MANIFEST"
          RAW_ROOT="$RUNNER_TEMP/rc/smoke/raw"
          RAW_ROOT="$RUNNER_TEMP/rc/smoke/raw/theme-forge-nebular-fusion"
          NPM_ROOT="$RUNNER_TEMP/rc/smoke/npm/package/payload"
          run_smoke() {
            xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- node tools/native-rc-smoke.mjs --platform "$NEBULAR_RC_PLATFORM" --scenario "$1" --launch-root "$2" --checkout . --evidence "$RUNNER_TEMP/rc/upload/evidence/smoke" --source "$3" --label "$NEBULAR_RC_PLATFORM-$1-$3"
          }
          run_smoke B "$RAW_ROOT" raw-archive
          run_smoke B "$NPM_ROOT" npm-package
      - name: Seal the candidate identity chain
        id: seal
        run: |
          printf '%s' "$NEBULAR_RC_PLAN" > "$RUNNER_TEMP/rc/upload/evidence/plan.json"
          node tools/native-rc-evidence.mjs seal --lane linux-arm64 --plan "$RUNNER_TEMP/rc/upload/evidence/plan.json" --candidate-dir "$RUNNER_TEMP/rc/upload/candidate" --package-record "$RUNNER_TEMP/rc/upload/evidence/package-record.json" --package-manifest "$RUNNER_TEMP/rc/upload/evidence/package-manifest.json" --qualification "$RUNNER_TEMP/rc/upload/evidence/qualification.json" --smoke-dir "$RUNNER_TEMP/rc/upload/evidence/smoke" --build-receipt "$RUNNER_TEMP/rc/upload/evidence/build-receipt.json" --output "$RUNNER_TEMP/rc/upload/evidence/rc-evidence.json"
          echo "evidence_sha256=$(node -p 'require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync(process.argv[1])).digest("hex")' "$RUNNER_TEMP/rc/upload/evidence/rc-evidence.json")" >> "$GITHUB_OUTPUT"
      # Upload immediately after the seal: the candidate files are the smoke-tested bytes, unchanged.
      - name: Upload the qualified candidate and its evidence
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.plan.outputs.linux_arm64_artifact }}
          path: ${{ runner.temp }}/rc/upload/
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.retention_days }}
          compression-level: 0
          overwrite: false
      - name: Restore write access for runner cleanup
        if: ${{ always() }}
        run: chmod -R u+w "$RUNNER_TEMP/rc" 2>/dev/null || true
      - name: Retain diagnostics without candidate binaries
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.plan.outputs.linux_arm64_diagnostics }}
          path: ${{ runner.temp }}/rc/upload/evidence/
          if-no-files-found: warn
          retention-days: ${{ needs.plan.outputs.diagnostics_retention_days }}
          overwrite: false

  linux-x64:
    name: Linux x64 release candidate (scenario C + C-signal)
    needs: plan
    if: needs.plan.outputs.linux_x64 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      image: debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251
      options: --init
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      evidence_sha256: ${{ steps.seal.outputs.evidence_sha256 }}
    env:
      NEBULAR_RC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NEBULAR_RC_PLATFORM: linux-x64
      NEBULAR_RC_TRIPLE: x86_64-unknown-linux-gnu
      NEBULAR_RC_PLAN: ${{ needs.plan.outputs.plan }}
      NEBULAR_RC_CONTAINER: debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251
      DEBIAN_FRONTEND: noninteractive
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
    steps:
      - name: Install the build and virtual display environment
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils build-essential ca-certificates curl dbus dbus-x11 git libappindicator3-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev patchelf pkg-config procps xauth xvfb xz-utils
          mkdir -p "$RUNNER_TEMP/rc/upload/evidence"
          dpkg-query -W -f '${Package} ${Version} ${Architecture}\n' | sort > "$RUNNER_TEMP/rc/upload/evidence/dpkg-packages.txt"
          echo "NEBULAR_RC_PACKAGES_SHA256=$(sha256sum "$RUNNER_TEMP/rc/upload/evidence/dpkg-packages.txt" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Check out the exact reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Trust exactly this job's workspace for Git
        run: |
          case "$GITHUB_WORKSPACE" in /*) ;; *) echo "::error::GITHUB_WORKSPACE is not absolute"; exit 1 ;; esac
          case "$GITHUB_WORKSPACE" in *'*'*) echo "::error::GITHUB_WORKSPACE contains a wildcard"; exit 1 ;; esac
          test "$(pwd -P)" = "$GITHUB_WORKSPACE"
          test -d "$GITHUB_WORKSPACE/.git"
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git config --show-origin --get-all safe.directory
          test -z "$(git config --get-all safe.directory | grep -Fxv -e "$GITHUB_WORKSPACE" || true)"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
      # A pull-request candidate is the head commit, and its tree must be exactly the tree that merges.
      - name: Bind the source commit and tree
        env:
          NEBULAR_RC_EVENT: ${{ github.event_name }}
          NEBULAR_RC_MERGE_SHA: ${{ github.sha }}
          NEBULAR_RC_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          NEBULAR_RC_REPOSITORY: ${{ github.repository }}
        run: |
          test "$(git rev-parse HEAD)" = "$NEBULAR_RC_SOURCE_SHA"
          echo "NEBULAR_RC_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
          if [ "$NEBULAR_RC_EVENT" = "pull_request" ]; then
            test "$NEBULAR_RC_HEAD_REPOSITORY" = "$NEBULAR_RC_REPOSITORY"
            git fetch --no-tags --depth=1 origin "$NEBULAR_RC_MERGE_SHA"
            test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')"
            {
              echo "NEBULAR_RC_MERGE_COMMIT=$NEBULAR_RC_MERGE_SHA"
              echo "NEBULAR_RC_MERGE_TREE=$(git rev-parse 'FETCH_HEAD^{tree}')"
            } >> "$GITHUB_ENV"
          fi
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.23.3
      - name: Select the repository-pinned Rust 1.98.0 toolchain
        run: |
          test "$(node -e 'import fs from "node:fs"; const s=fs.readFileSync("rust-toolchain.toml","utf8"); process.stdout.write(s.match(/channel\s*=\s*"([^"]+)"/)[1])')" = "1.98.0"
          RUSTUP_DIR="$RUNNER_TEMP/rustup-init"
          mkdir -p "$RUSTUP_DIR"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUSTUP_DIR/rustup-init" "https://static.rust-lang.org/rustup/dist/$NEBULAR_RC_TRIPLE/rustup-init"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUSTUP_DIR/rustup-init.sha256" "https://static.rust-lang.org/rustup/dist/$NEBULAR_RC_TRIPLE/rustup-init.sha256"
          test "$(cut -d' ' -f1 "$RUSTUP_DIR/rustup-init.sha256")" = "$(sha256sum "$RUSTUP_DIR/rustup-init" | cut -d' ' -f1)"
          chmod +x "$RUSTUP_DIR/rustup-init"
          export RUSTUP_HOME="$RUNNER_TEMP/rustup" CARGO_HOME="$RUNNER_TEMP/cargo-home"
          "$RUSTUP_DIR/rustup-init" -y --no-modify-path --profile minimal --default-toolchain 1.98.0
          {
            echo "RUSTUP_HOME=$RUSTUP_HOME"
            echo "CARGO_HOME=$CARGO_HOME"
            echo "RUSTUP_TOOLCHAIN=1.98.0"
          } >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          RUSTUP_TOOLCHAIN=1.98.0 rustc --version | grep '^rustc 1.98.0 '
          RUSTUP_TOOLCHAIN=1.98.0 cargo --version | grep '^cargo 1.98.0 '
      - name: Authenticate the embedded Node runtime
        run: |
          mkdir -p .test-reports/nebular/node-authenticity
          NODE_DIR="$RUNNER_TEMP/node-linux"
          ARCHIVE=$(node --input-type=module -e 'import { NODE_RELEASE_IDENTITY } from "./tools/node-runtime-authority.mjs"; process.stdout.write(NODE_RELEASE_IDENTITY.targets[process.env.NEBULAR_RC_TRIPLE].archive)')
          mkdir -p "$NODE_DIR"
          curl --proto '=https' --tlsv1.2 -fsSLo "$NODE_DIR/SHASUMS256.txt.asc" https://nodejs.org/dist/v22.23.3/SHASUMS256.txt.asc
          curl --proto '=https' --tlsv1.2 -fsSLo "$NODE_DIR/$ARCHIVE" "https://nodejs.org/dist/v22.23.3/$ARCHIVE"
          node tools/node-runtime-authority.mjs --authenticate-linux "$NODE_DIR" --target "$NEBULAR_RC_TRIPLE" --output-node "$RUNNER_TEMP/node-authenticated" --output .test-reports/nebular/node-authenticity/receipt.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix loom-preview-source --ignore-scripts
      - run: npm run build
      - name: Build and verify sidecar, Loom and scene payloads
        run: |
          ROOT_TGZ=$(find authenticated-inputs/core-tarball -name '*.tgz' -type f -print -quit)
          test -n "$ROOT_TGZ"
          node tools/sidecar-prepare.mjs --node "$RUNNER_TEMP/node-authenticated" --root-tarball "$ROOT_TGZ" --target "$NEBULAR_RC_TRIPLE"
          cp src-tauri/sidecar-payload/manifest.json "$RUNNER_TEMP/manifest-first.json"
          node tools/sidecar-prepare.mjs --node "$RUNNER_TEMP/node-authenticated" --root-tarball "$ROOT_TGZ" --target "$NEBULAR_RC_TRIPLE"
          cmp "$RUNNER_TEMP/manifest-first.json" src-tauri/sidecar-payload/manifest.json
          node tools/loom-prepare.mjs
          if [ -d authenticated-inputs/scene-tarball ]; then
            SCENE_TGZ=$(find authenticated-inputs/scene-tarball -name '*.tgz' -type f -print -quit)
            if [ -n "$SCENE_TGZ" ]; then
              node tools/scene-prepare.mjs prepare "$SCENE_TGZ" "$RUNNER_TEMP/node-authenticated"
              node tools/scene-prepare.mjs verify src-tauri/scene-payload "$RUNNER_TEMP/node-authenticated"
            fi
          fi
          node tools/sidecar-verify.mjs
      - name: Fetch locked Rust dependencies and generate release notices
        run: |
          (cd src-tauri && cargo fetch --locked --target "$NEBULAR_RC_TRIPLE")
          node tools/release-notices.mjs
          node tools/ci/verify-tauri-resource-closure.mjs --build-ready --target "$NEBULAR_RC_TRIPLE"
      - name: Compile the native release payload
        env:
          TFSB_STUDIO_NODE_BINARY: ${{ runner.temp }}/node-authenticated
        run: |
          npm run tauri:build
          RAW=$(find src-tauri/target -type d -path '*/release/bundle/raw' -print -quit)
          test -n "$RAW"
          mkdir -p "$RUNNER_TEMP/rc"
          cp -a "$RAW" "$RUNNER_TEMP/rc/payload"
      - name: Qualify the native payload
        run: |
          mkdir -p "$RUNNER_TEMP/rc/upload/evidence"
          node tools/native-rc-qualify.mjs --platform "$NEBULAR_RC_PLATFORM" --payload "$RUNNER_TEMP/rc/payload" --checkout . --output "$RUNNER_TEMP/rc/upload/evidence/qualification.json"
          node tools/native-rc-evidence.mjs build-receipt --platform "$NEBULAR_RC_PLATFORM" --checkout . --payload "$RUNNER_TEMP/rc/payload" --node-receipt .test-reports/nebular/node-authenticity/receipt.json --npm-cli "$(dirname "$(command -v node)")/../lib/node_modules/npm/bin/npm-cli.js" --source-commit "$NEBULAR_RC_SOURCE_SHA" ${NEBULAR_RC_MERGE_COMMIT:+--merge-commit "$NEBULAR_RC_MERGE_COMMIT" --merge-tree "$NEBULAR_RC_MERGE_TREE"} --output "$RUNNER_TEMP/rc/upload/evidence/build-receipt.json"
          cp .test-reports/nebular/node-authenticity/receipt.json "$RUNNER_TEMP/rc/upload/evidence/node-authenticity.json"
      - name: Package the exact candidate bytes
        run: |
          GLIBC=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).glibcMinimum ?? ""' "$RUNNER_TEMP/rc/upload/evidence/qualification.json")
          node tools/native-rc-package.mjs --platform "$NEBULAR_RC_PLATFORM" --payload "$RUNNER_TEMP/rc/payload" --checkout . --output "$RUNNER_TEMP/rc/upload" --npm-cli "$(dirname "$(command -v node)")/../lib/node_modules/npm/bin/npm-cli.js" ${GLIBC:+--glibc-minimum "$GLIBC"}
          mv "$RUNNER_TEMP/rc/upload/package-record.json" "$RUNNER_TEMP/rc/upload/package-manifest.json" "$RUNNER_TEMP/rc/upload/evidence/"
          chmod -R a-w "$RUNNER_TEMP/rc/upload/candidate"
      # Smoke runs read the read-only candidate files only: each scenario is launched once from the
      # extracted raw archive and once from the extracted npm package.
      - name: Smoke-test the exact packaged candidate
        run: |
          set -e
          RAW=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).raw.filename' "$RUNNER_TEMP/rc/upload/evidence/package-record.json")
          TGZ=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).npm.filename' "$RUNNER_TEMP/rc/upload/evidence/package-record.json")
          MANIFEST=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).packageManifestSha256' "$RUNNER_TEMP/rc/upload/evidence/package-record.json")
          mkdir -p "$RUNNER_TEMP/rc/smoke/raw" "$RUNNER_TEMP/rc/smoke/npm" "$RUNNER_TEMP/rc/upload/evidence/smoke"
          tar -xzf "$RUNNER_TEMP/rc/upload/candidate/$RAW" -C "$RUNNER_TEMP/rc/smoke/raw"
          tar -xzf "$RUNNER_TEMP/rc/upload/candidate/$TGZ" -C "$RUNNER_TEMP/rc/smoke/npm"
          node tools/native-rc-package.mjs verify --platform "$NEBULAR_RC_PLATFORM" --package-root "$RUNNER_TEMP/rc/smoke/npm/package" --manifest-sha256 "$MANIFEST"
          RAW_ROOT="$RUNNER_TEMP/rc/smoke/raw"
          RAW_ROOT="$RUNNER_TEMP/rc/smoke/raw/theme-forge-nebular-fusion"
          NPM_ROOT="$RUNNER_TEMP/rc/smoke/npm/package/payload"
          run_smoke() {
            xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- node tools/native-rc-smoke.mjs --platform "$NEBULAR_RC_PLATFORM" --scenario "$1" --launch-root "$2" --checkout . --evidence "$RUNNER_TEMP/rc/upload/evidence/smoke" --source "$3" --label "$NEBULAR_RC_PLATFORM-$1-$3"
          }
          run_smoke C "$RAW_ROOT" raw-archive
          run_smoke C-signal "$NPM_ROOT" npm-package
      - name: Seal the candidate identity chain
        id: seal
        run: |
          printf '%s' "$NEBULAR_RC_PLAN" > "$RUNNER_TEMP/rc/upload/evidence/plan.json"
          node tools/native-rc-evidence.mjs seal --lane linux-x64 --plan "$RUNNER_TEMP/rc/upload/evidence/plan.json" --candidate-dir "$RUNNER_TEMP/rc/upload/candidate" --package-record "$RUNNER_TEMP/rc/upload/evidence/package-record.json" --package-manifest "$RUNNER_TEMP/rc/upload/evidence/package-manifest.json" --qualification "$RUNNER_TEMP/rc/upload/evidence/qualification.json" --smoke-dir "$RUNNER_TEMP/rc/upload/evidence/smoke" --build-receipt "$RUNNER_TEMP/rc/upload/evidence/build-receipt.json" --output "$RUNNER_TEMP/rc/upload/evidence/rc-evidence.json"
          echo "evidence_sha256=$(node -p 'require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync(process.argv[1])).digest("hex")' "$RUNNER_TEMP/rc/upload/evidence/rc-evidence.json")" >> "$GITHUB_OUTPUT"
      # Upload immediately after the seal: the candidate files are the smoke-tested bytes, unchanged.
      - name: Upload the qualified candidate and its evidence
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.plan.outputs.linux_x64_artifact }}
          path: ${{ runner.temp }}/rc/upload/
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.retention_days }}
          compression-level: 0
          overwrite: false
      - name: Restore write access for runner cleanup
        if: ${{ always() }}
        run: chmod -R u+w "$RUNNER_TEMP/rc" 2>/dev/null || true
      - name: Retain diagnostics without candidate binaries
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.plan.outputs.linux_x64_diagnostics }}
          path: ${{ runner.temp }}/rc/upload/evidence/
          if-no-files-found: warn
          retention-days: ${{ needs.plan.outputs.diagnostics_retention_days }}
          overwrite: false

  linux_closure:
    name: Linux ELF closure diagnostic (${{ matrix.arch }} / ${{ matrix.libc_lane }})
    needs: [plan, linux-arm64, linux-x64]
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.linux_closure == true &&
        needs.plan.outputs.linux_arm64 == 'true' &&
        needs.plan.outputs.linux_x64 == 'true'
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Diagnostic lanes only. A baseline failure is retained negative evidence and never a release pass.
          - arch: linux-arm64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64:2026.09.05-1@sha256:ad74e53b713f3b07d8c889c526dc0c6500da9827b45e38739570875fef52e28f
            libc_lane: manylinux_2_28_baseline
            glibc_floor: "2.28"
            expected_runtime_glibc: "2.28"
            expected_missing_gui: true
            artifact: arm64
            scenario: B
          - arch: linux-arm64
            runner: ubuntu-24.04-arm
            image: debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251
            libc_lane: debian_bookworm_glibc_2_36_newer
            glibc_floor: ""
            expected_runtime_glibc: "2.36"
            expected_missing_gui: false
            artifact: arm64
            scenario: B
          - arch: linux-x64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.09.05-1@sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c
            libc_lane: manylinux_2_28_baseline
            glibc_floor: "2.28"
            expected_runtime_glibc: "2.28"
            expected_missing_gui: true
            artifact: x64
            scenario: C
          - arch: linux-x64
            runner: ubuntu-24.04
            image: debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251
            libc_lane: debian_bookworm_glibc_2_36_newer
            glibc_floor: ""
            expected_runtime_glibc: "2.36"
            expected_missing_gui: false
            artifact: x64
            scenario: C
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
      options: --init
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # Download the exact same-run candidate and sealed evidence.
    env:
      NEBULAR_CLOSURE_ARCH: ${{ matrix.arch }}
      NEBULAR_CLOSURE_IMAGE: ${{ matrix.image }}
      NEBULAR_CLOSURE_LANE: ${{ matrix.libc_lane }}
      NEBULAR_CLOSURE_GLIBC_FLOOR: ${{ matrix.glibc_floor }}
      NEBULAR_CLOSURE_EXPECTED_RUNTIME_GLIBC: ${{ matrix.expected_runtime_glibc }}
      NEBULAR_CLOSURE_EXPECTED_MISSING_GUI: ${{ matrix.expected_missing_gui }}
      NEBULAR_CLOSURE_SCENARIO: ${{ matrix.scenario }}
      NEBULAR_CLOSURE_PRODUCER_ARTIFACT_ID: ${{ matrix.artifact == 'arm64' && needs['linux-arm64'].outputs.artifact_id || needs['linux-x64'].outputs.artifact_id }}
      NEBULAR_CLOSURE_PRODUCER_ARTIFACT_NAME: ${{ matrix.artifact == 'arm64' && needs.plan.outputs.linux_arm64_artifact || needs.plan.outputs.linux_x64_artifact }}
      NEBULAR_CLOSURE_PRODUCER_EVIDENCE_SHA256: ${{ matrix.artifact == 'arm64' && needs['linux-arm64'].outputs.evidence_sha256 || needs['linux-x64'].outputs.evidence_sha256 }}
      NEBULAR_RC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Prepare pinned diagnostic prerequisites
        id: prerequisites
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$RUNNER_TEMP/nebular-closure"
          REPORT="$ROOT/report"
          mkdir -p "$REPORT" "$ROOT/artifact" "$ROOT/raw"
          manager=unknown
          install_status=0
          smoke_install_status=0
          gui_policy=baseline-no-gui-libraries
          if [ "$NEBULAR_CLOSURE_LANE" = "debian_bookworm_glibc_2_36_newer" ]; then
            gui_policy=debian-bookworm-consumer-gui-libraries
          fi
          if command -v apt-get >/dev/null 2>&1; then
            manager=apt
            apt-get update || install_status=$?
            if [ "$install_status" -eq 0 ]; then
              packages=(binutils ca-certificates file git procps tar xz-utils)
              smoke_packages=(dbus dbus-x11 xauth xvfb)
              if [ "$NEBULAR_CLOSURE_LANE" = "debian_bookworm_glibc_2_36_newer" ]; then
                # The native producer requests libappindicator3-dev. Bookworm resolves that virtual
                # dependency to Ayatana, whose runtime soname is libayatana-appindicator3.so.1.
                packages+=(libayatana-appindicator3-1 libgtk-3-0 libjavascriptcoregtk-4.1-0 librsvg2-2 libsoup-3.0-0 libwebkit2gtk-4.1-0)
              fi
              apt-get install -y --no-install-recommends "${packages[@]}" || install_status=$?
              if [ "$install_status" -eq 0 ]; then
                apt-get install -y --no-install-recommends "${smoke_packages[@]}" || smoke_install_status=$?
              fi
            fi
          elif command -v dnf >/dev/null 2>&1; then
            manager=dnf
            packages=(binutils ca-certificates file git procps tar xz)
            smoke_packages=(dbus-daemon dbus-tools xorg-x11-server-Xvfb xorg-x11-xauth)
            if [ "$NEBULAR_CLOSURE_LANE" = "debian_bookworm_glibc_2_36_newer" ]; then
              printf '%s\n' 'consumer GUI package set is only defined for the pinned Debian image' > "$REPORT/unsupported-consumer-manager.txt"
              install_status=1
            else
              dnf --setopt=install_weak_deps=False install -y "${packages[@]}" || install_status=$?
              if [ "$install_status" -eq 0 ]; then
                dnf --setopt=install_weak_deps=False install -y "${smoke_packages[@]}" || smoke_install_status=$?
              fi
            fi
          elif command -v microdnf >/dev/null 2>&1; then
            manager=microdnf
            packages=(binutils ca-certificates file git procps tar xz)
            smoke_packages=(dbus-daemon dbus-tools xorg-x11-server-Xvfb xorg-x11-xauth)
            if [ "$NEBULAR_CLOSURE_LANE" = "debian_bookworm_glibc_2_36_newer" ]; then
              printf '%s\n' 'consumer GUI package set is only defined for the pinned Debian image' > "$REPORT/unsupported-consumer-manager.txt"
              install_status=1
            else
              microdnf --setopt=install_weak_deps=False install -y "${packages[@]}" || install_status=$?
              if [ "$install_status" -eq 0 ]; then
                microdnf --setopt=install_weak_deps=False install -y "${smoke_packages[@]}" || smoke_install_status=$?
              fi
            fi
          else
            printf '%s\n' 'no supported package manager in pinned closure image' > "$REPORT/no-package-manager.txt"
            install_status=1
          fi
          missing=""
          for tool in file readelf ldd sha256sum tar git; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing="${missing:+$missing,}$tool"
            fi
          done
          if [ -n "$missing" ]; then install_status=1; fi
          smoke_missing=""
          for tool in xvfb-run dbus-run-session; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              smoke_missing="${smoke_missing:+$smoke_missing,}$tool"
            fi
          done
          if [ "$NEBULAR_CLOSURE_LANE" = "debian_bookworm_glibc_2_36_newer" ] && { [ "$smoke_install_status" -ne 0 ] || [ -n "$smoke_missing" ]; }; then
            install_status=1
          fi
          if command -v dpkg-query >/dev/null 2>&1; then
            dpkg-query -W -f '${Package} ${Version} ${Architecture}\n' | sort > "$REPORT/package-inventory.txt" || install_status=1
          elif command -v rpm >/dev/null 2>&1; then
            rpm -qa --qf '%{NAME} %{VERSION}-%{RELEASE}.%{ARCH}\n' | sort > "$REPORT/package-inventory.txt" || install_status=1
          else
            printf '%s\n' 'package inventory tool unavailable' > "$REPORT/package-inventory.txt"
            install_status=1
          fi
          {
            printf 'schema=nebular.linux-closure-prerequisites-v2\n'
            printf 'manager=%s\ninstall_status=%s\nmissing_tools=%s\nsmoke_install_status=%s\nsmoke_missing_tools=%s\nsmoke_available=%s\n' "$manager" "$install_status" "$missing" "$smoke_install_status" "$smoke_missing" "$([ -z "$smoke_missing" ] && echo true || echo false)"
            printf 'lane=%s\nexpected_missing_gui=%s\ngui_policy=%s\n' "$NEBULAR_CLOSURE_LANE" "$NEBULAR_CLOSURE_EXPECTED_MISSING_GUI" "$gui_policy"
          } > "$REPORT/install-result.txt"
          exit "$install_status"
      - name: Check out the exact reviewed source
        if: always()
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Trust exactly this job's workspace for Git
        if: always()
        run: |
          case "$GITHUB_WORKSPACE" in /*) ;; *) echo "::error::GITHUB_WORKSPACE is not absolute"; exit 1 ;; esac
          case "$GITHUB_WORKSPACE" in *'*'*) echo "::error::GITHUB_WORKSPACE contains a wildcard"; exit 1 ;; esac
          test "$(pwd -P)" = "$GITHUB_WORKSPACE"
          test -d "$GITHUB_WORKSPACE/.git"
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git config --show-origin --get-all safe.directory
          test -z "$(git config --get-all safe.directory | grep -Fxv -e "$GITHUB_WORKSPACE" || true)"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
      - name: Bind the source commit and tree
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$NEBULAR_RC_SOURCE_SHA"
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          test "$SOURCE_TREE" != ""
          echo "NEBULAR_RC_SOURCE_TREE=$SOURCE_TREE" >> "$GITHUB_ENV"
      - name: Set up the pinned diagnostic Node runtime
        if: always()
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.23.3
      - name: Record the pinned runtime and GUI-library observation
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$RUNNER_TEMP/nebular-closure"
          REPORT="$ROOT/report"
          cat /etc/os-release > "$REPORT/os-release.txt" 2>&1 || true
          node --input-type=module - "$REPORT/system-library-probe.json" "$NEBULAR_CLOSURE_EXPECTED_MISSING_GUI" <<'NODE'
          import { spawnSync } from "node:child_process";
          import { writeFileSync } from "node:fs";
          const [output, expected] = process.argv.slice(2);
          const specs = [
            ["gtk3", "libgtk-3.so.0"],
            ["webkitgtk-4.1", "libwebkit2gtk-4.1.so.0"],
            ["javascriptcoregtk-4.1", "libjavascriptcoregtk-4.1.so.0"],
            ["libsoup-3", "libsoup-3.0.so.0"],
            ["librsvg", "librsvg-2.so.2"],
            ["appindicator", "libayatana-appindicator3.so.1"],
          ];
          const result = spawnSync("ldconfig", ["-p"], { encoding: "utf8" });
          const catalogue = `${result.stdout ?? ""}\n${result.stderr ?? ""}`;
          const libraries = specs.map(([id, soname]) => ({ id, soname, available: result.status === 0 && catalogue.includes(soname) }));
          const missing = libraries.filter((library) => !library.available).map((library) => library.id);
          writeFileSync(output, `${JSON.stringify({ schema: "nebular.linux-system-library-probe-v1", expectedMissingGui: expected === "true", probeStatus: result.status, libraries, missing }, null, 2)}\n`, { flag: "wx" });
          NODE
      - name: Download the exact raw candidate for this architecture
        if: matrix.artifact == 'arm64'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs['linux-arm64'].outputs.artifact_id }}
          path: ${{ runner.temp }}/nebular-closure/artifact
      - name: Download the exact raw candidate for this architecture
        if: matrix.artifact == 'x64'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs['linux-x64'].outputs.artifact_id }}
          path: ${{ runner.temp }}/nebular-closure/artifact
      - name: Bind the sealed archive and inspect every ELF member
        id: closure
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$RUNNER_TEMP/nebular-closure"
          REPORT="$ROOT/report"
          mkdir -p "$REPORT" "$ROOT/raw"
          SOURCE_TREE="${NEBULAR_RC_SOURCE_TREE:?source tree binding is missing}"
          ARTIFACT_NAME="${NEBULAR_CLOSURE_PRODUCER_ARTIFACT_NAME:?producer artifact name binding is missing}"
          case "$ARTIFACT_NAME" in
            ""|.|..|*/*|*\\*) echo "::error::producer artifact name is not a single path component" >&2; exit 1 ;;
          esac
          ARTIFACT_ROOT="$ROOT/artifact/$ARTIFACT_NAME"
          mapfile -d '' ARTIFACT_ENTRIES < <(find "$ROOT/artifact" -mindepth 1 -maxdepth 1 -print0)
          test "${#ARTIFACT_ENTRIES[@]}" -eq 1
          test "${ARTIFACT_ENTRIES[0]}" = "$ARTIFACT_ROOT"
          test -d "$ARTIFACT_ROOT" && test ! -L "$ARTIFACT_ROOT"
          closure_exit=0
          node tools/native-rc-linux-closure.mjs \
            --arch "$NEBULAR_CLOSURE_ARCH" \
            --lane "$NEBULAR_CLOSURE_LANE" \
            --image "$NEBULAR_CLOSURE_IMAGE" \
            --candidate-dir "$ARTIFACT_ROOT/candidate" \
            --package-record "$ARTIFACT_ROOT/evidence/package-record.json" \
            --sealed-evidence "$ARTIFACT_ROOT/evidence/rc-evidence.json" \
            --extract-dir "$ROOT/raw" \
            --source-commit "$NEBULAR_RC_SOURCE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --sealed-evidence-sha256 "$NEBULAR_CLOSURE_PRODUCER_EVIDENCE_SHA256" \
            --expected-runtime-glibc "$NEBULAR_CLOSURE_EXPECTED_RUNTIME_GLIBC" \
            --system-library-probe "$REPORT/system-library-probe.json" \
            --glibc-floor "$NEBULAR_CLOSURE_GLIBC_FLOOR" \
            --report "$REPORT/linux-closure.json" || closure_exit=$?
          printf 'closure_exit=%s\n' "$closure_exit" > "$REPORT/closure-status.txt"
      - name: Run the maintained consumer smoke harness
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$RUNNER_TEMP/nebular-closure"
          REPORT="$ROOT/report"
          RAW_ROOT="$ROOT/raw/theme-forge-nebular-fusion"
          smoke_status=127
          if [ ! -s "$REPORT/linux-closure.json" ]; then
            printf '%s\n' 'consumer smoke not run because the closure report is missing' > "$REPORT/consumer.log"
            printf '%s\n' '127' > "$REPORT/consumer-status.txt"
            exit 0
          fi
          if node -e 'const report = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); process.exit(report.classification === "identity" ? 0 : 1);' "$REPORT/linux-closure.json"; then
            printf '%s\n' 'consumer smoke skipped because candidate identity failed' > "$REPORT/consumer.log"
            printf '%s\n' 'identity-skipped' > "$REPORT/consumer-status.txt"
            exit 0
          fi
          if [ -d "$RAW_ROOT" ] && command -v node >/dev/null 2>&1 && command -v xvfb-run >/dev/null 2>&1 && command -v dbus-run-session >/dev/null 2>&1; then
            mkdir -p "$REPORT/smoke"
            smoke_status=0
            xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- \
              node tools/native-rc-smoke.mjs \
                --platform "$NEBULAR_CLOSURE_ARCH" \
                --scenario "$NEBULAR_CLOSURE_SCENARIO" \
                --launch-root "$RAW_ROOT" \
                --checkout . \
                --evidence "$REPORT/smoke" \
                --source raw-archive \
                --label "$NEBULAR_CLOSURE_ARCH-$NEBULAR_CLOSURE_LANE" \
              > "$REPORT/consumer.log" 2>&1 || smoke_status=$?
          else
            printf '%s\n' 'consumer prerequisites unavailable or exact payload root was not extracted' > "$REPORT/consumer.log"
          fi
          printf '%s\n' "$smoke_status" > "$REPORT/consumer-status.txt"
          exit "$smoke_status"
      - name: Finalize the fail-closed diagnostic result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$RUNNER_TEMP/nebular-closure"
          REPORT="$ROOT/report"
          if [ ! -s "$REPORT/linux-closure.json" ]; then
            printf '%s\n' '{"schema":"nebular.linux-elf-closure-v3","status":"fail","classification":"environment","negativeEvidence":false,"problems":["closure helper did not produce a report"]}' > "$REPORT/linux-closure.json"
          fi
          if [ ! -s "$REPORT/install-result.txt" ]; then printf '%s\n' 'install_status=missing' > "$REPORT/install-result.txt"; fi
          if [ ! -s "$REPORT/closure-status.txt" ]; then printf '%s\n' 'closure_exit=missing' > "$REPORT/closure-status.txt"; fi
          if [ ! -s "$REPORT/consumer-status.txt" ]; then printf '%s\n' '127' > "$REPORT/consumer-status.txt"; fi
          node --input-type=module - "$REPORT/linux-closure.json" "$REPORT/install-result.txt" "$REPORT/closure-status.txt" "$REPORT/consumer-status.txt" "$REPORT/result.json" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const [closurePath, installPath, closureStatusPath, consumerStatusPath, resultPath] = process.argv.slice(2);
          const closure = JSON.parse(readFileSync(closurePath, "utf8"));
          const install = readFileSync(installPath, "utf8");
          const closureStatus = readFileSync(closureStatusPath, "utf8").trim();
          const consumerStatus = readFileSync(consumerStatusPath, "utf8").trim();
          const installOk = /^install_status=0$/m.test(install);
          let classification = "environment";
          if (installOk) {
            classification = closure.classification ?? (closure.status === "pass" ? "pass" : "identity");
            if (closure.status !== "pass" || closureStatus !== "closure_exit=0") classification = classification === "pass" ? "environment" : classification;
            else if (consumerStatus !== "0") classification = "smoke";
            else classification = "pass";
          }
          const consumerSkipped = consumerStatus === "identity-skipped";
          const passed = installOk && closure.status === "pass" && closureStatus === "closure_exit=0" && consumerStatus === "0" && classification === "pass";
          const result = { schema: "nebular.linux-closure-result-v3", status: passed ? "pass" : "fail", classification, negativeEvidence: classification.startsWith("closure-negative:"), installOk, producerArtifactId: process.env.NEBULAR_CLOSURE_PRODUCER_ARTIFACT_ID ?? null, producerArtifactName: process.env.NEBULAR_CLOSURE_PRODUCER_ARTIFACT_NAME ?? null, producerEvidenceSha256: process.env.NEBULAR_CLOSURE_PRODUCER_EVIDENCE_SHA256 ?? null, closureStatus: closure.status ?? "missing", consumerStatus, source: closure.source ?? null, runtimeGlibc: closure.runtimeGlibc ?? null, glibcMinimum: closure.glibcMinimum ?? null, environment: { osRelease: "os-release.txt", systemLibraryProbe: "system-library-probe.json" }, problems: [...(closure.problems ?? []), ...(consumerStatus !== "0" && !consumerSkipped ? ["consumer smoke failed"] : [])] };
          writeFileSync(resultPath, `${JSON.stringify(result, null, 2)}\n`, { flag: "wx" });
          writeFileSync(resultPath.replace(/result\.json$/, "status.txt"), `${passed ? 0 : 1}\n`, { flag: "wx" });
          process.exitCode = passed ? 0 : 1;
          NODE
      - name: Name this closure evidence attempt
        id: closure-name
        if: always()
        shell: bash
        run: echo "name=nebular-rc-diag-linux-closure-${NEBULAR_CLOSURE_ARCH}-${NEBULAR_CLOSURE_LANE}-${GITHUB_SHA:0:12}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload closure evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.closure-name.outputs.name }}
          path: ${{ runner.temp }}/nebular-closure/report/
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.diagnostics_retention_days }}
          compression-level: 0
          overwrite: false
      - name: Enforce the qualification result for this diagnostic lane
        if: always()
        shell: bash
        run: |
          test -s "$RUNNER_TEMP/nebular-closure/report/status.txt"
          test "$(cat "$RUNNER_TEMP/nebular-closure/report/status.txt")" = 0

  rc-index:
    name: Release-candidate catalog
    needs: [plan, macos-arm64, linux-arm64, linux-x64]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # Reads back each uploaded artifact's digest and expiry.
    env:
      NEBULAR_RC_PLAN: ${{ needs.plan.outputs.plan }}
      NEBULAR_RC_NEEDS: ${{ toJson(needs) }}
    steps:
      - name: Check out the exact reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.23.3
      - name: List the uploaded candidate artifacts
        id: ids
        run: node -e 'const n = JSON.parse(process.env.NEBULAR_RC_NEEDS); const ids = Object.values(n).map((job) => job.outputs && job.outputs.artifact_id).filter((id) => /^[0-9]+$/.test(id || "")); require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, "ids=" + ids.join(",") + "\n");'
      - name: Download the candidate artifacts by id
        if: ${{ steps.ids.outputs.ids != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.ids.outputs.ids }}
          path: .rc-artifacts/
      # CI11: the catalog directory is not hidden. upload-artifact excludes hidden files by default, and
      # CI10's .rc-index/ was dropped with only a warning, so a passing catalog was never retained.
      - name: Catalog every lane
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rc-index .rc-artifacts
          node tools/native-rc-index.mjs --download-dir .rc-artifacts --output rc-index/rc-index.json
      # A failing catalog still writes its file and is retained as evidence; no file fails the job here.
      - name: Require exactly one regular rc-index.json
        id: catalog-file
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          if [[ -L rc-index || ! -d rc-index ]]; then echo "rc-index is not a directory" >&2; exit 1; fi
          entries=(rc-index/*)
          if [[ ${#entries[@]} -ne 1 || ${entries[0]} != rc-index/rc-index.json ]]; then echo "rc-index must hold exactly rc-index.json" >&2; exit 1; fi
          if [[ -L rc-index/rc-index.json || ! -f rc-index/rc-index.json || ! -s rc-index/rc-index.json ]]; then echo "rc-index/rc-index.json is not a non-empty regular file" >&2; exit 1; fi
      - name: Upload the release-candidate catalog
        if: ${{ always() && steps.catalog-file.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nebular-rc-index-${{ github.run_id }}-a${{ github.run_attempt }}
          path: rc-index/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: ${{ needs.plan.outputs.retention_days || 14 }}
          overwrite: false
