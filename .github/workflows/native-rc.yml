name: Nebular held saved-illustration macOS candidate

on:
  workflow_dispatch:
    inputs:
      confirm_illustration_readonly:
        description: Run held saved-illustration I after A/M/P (no release or signing)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nebular-source-native-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64-source-native:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirm_illustration_readonly == 'true' &&
      github.repository == 'Knowledge-Forge-AI/theme-forge-nebular-fusion' &&
      github.ref == 'refs/heads/qualification/illustration-brand13-compatibility-20261117'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out the exact qualification branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Use the pinned Node runtime
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.23.4
          check-latest: false
      - name: Use existing Python 3.13 class
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # existing pinned revision
        with:
          python-version: "3.13.12"
      - name: Recheck repository and ref before the controller
        env:
          EXPECTED_REPOSITORY: Knowledge-Forge-AI/theme-forge-nebular-fusion
          EXPECTED_REF: refs/heads/qualification/illustration-brand13-compatibility-20261117
        run: |
          set -eu
          test "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          test "${GITHUB_REF}" = "${EXPECTED_REF}"
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${RUNNER_OS}" = macOS
          test "${RUNNER_ARCH}" = ARM64
      - name: Prepare the private fixed-path controller spec
        env:
          NEBULAR_SOURCE_NATIVE_SPEC: ${{ runner.temp }}/nebular-source-native/spec.json
          NEBULAR_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -eu
          node tools/source-native/spec-builder.mjs
      - name: Run the bounded source-native controller
        env:
          NEBULAR_SOURCE_NATIVE_SPEC: ${{ runner.temp }}/nebular-source-native/spec.json
        run: |
          set -eu
          test -f "${NEBULAR_SOURCE_NATIVE_SPEC}"
          node tools/source-native/controller.mjs --spec "${NEBULAR_SOURCE_NATIVE_SPEC}"
      - name: Upload only the allowlisted held candidate and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nebular-source-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nebular-source-native/public
          if-no-files-found: error
          retention-days: 14

