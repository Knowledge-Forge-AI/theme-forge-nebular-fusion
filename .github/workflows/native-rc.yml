name: GitHub token direct binary asset capability

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Same-repository owner/name; must equal github.repository
        required: true
        type: string
      asset_id:
        description: Numeric ID of the single harmless asset attached to the private draft
        required: true
        type: string
      asset_name:
        description: Exact basename expected from the asset metadata
        required: true
        type: string
      asset_bytes:
        description: Exact byte count, bounded to 64 KiB
        required: true
        type: string
      asset_sha256:
        description: Lowercase SHA-256 of the harmless asset
        required: true
        type: string

permissions:
  contents: read

jobs:
  read-one-asset:
    permissions:
      contents: write
    name: Read one exact asset (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-24.04
            runner: ubuntu-24.04
          - label: macos-15-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_REPO: ${{ inputs.repo }}
      INPUT_ASSET_ID: ${{ inputs.asset_id }}
      INPUT_ASSET_NAME: ${{ inputs.asset_name }}
      INPUT_ASSET_BYTES: ${{ inputs.asset_bytes }}
      INPUT_ASSET_SHA256: ${{ inputs.asset_sha256 }}
    steps:
      - name: Fetch and verify one exact release asset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          MAX = 64 * 1024
          API = "api.github.com"
          CDNS = {"release-assets.githubusercontent.com", "objects.githubusercontent.com"}
          REPO = re.compile(r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")
          ID = re.compile(r"^[1-9][0-9]{0,19}$")
          NAME = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$")
          SHA = re.compile(r"^[0-9a-f]{64}$")

          class Failure(Exception):
              pass

          def need(value, reason):
              if not value:
                  raise Failure(reason)

          class Redirects(urllib.request.HTTPRedirectHandler):
              def __init__(self):
                  self.count = 0

              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  if self.count >= 2:
                      raise Failure("redirect_limit")
                  try:
                      target = urllib.parse.urlsplit(urllib.parse.urljoin(request.full_url, newurl))
                      port = target.port
                  except (TypeError, ValueError):
                      raise Failure("redirect_url")
                  need(target.scheme == "https" and not target.username and not target.password and port in (None, 443), "redirect_url")
                  need(target.hostname in {API, *CDNS}, "redirect_host")
                  if target.hostname == API:
                      need(target.path.startswith("/repos/"), "redirect_api_path")
                  self.count += 1
                  redirected = super().redirect_request(request, fp, code, msg, headers, newurl)
                  if redirected is not None and target.hostname != API:
                      for header in ("Authorization", "Proxy-Authorization", "Cookie"):
                          redirected.remove_header(header)
                  return redirected

          def read_response(response, limit):
              declared = response.headers.get("Content-Length")
              if declared is not None:
                  try:
                      need(0 <= int(declared) <= limit, "response_size")
                  except ValueError:
                      raise Failure("response_size")
              body = response.read(limit + 1)
              need(len(body) <= limit, "response_size")
              return body

          def get_asset(url, token, accept, limit):
              try:
                  parsed = urllib.parse.urlsplit(url)
                  need(parsed.scheme == "https" and parsed.hostname == API and parsed.port in (None, 443), "api_url")
                  request = urllib.request.Request(url, headers={
                      "Accept": accept,
                      "Authorization": "Bearer " + token,
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "github-token-contents-read-probe/1",
                  })
                  redirect = Redirects()
                  with urllib.request.build_opener(redirect).open(request, timeout=5) as response:
                      need(response.status == 200, "http_status")
                      return read_response(response, limit), redirect.count
              except Failure:
                  raise
              except urllib.error.HTTPError as exc:
                  raise Failure("http_" + str(exc.code))
              except (urllib.error.URLError, TimeoutError, OSError, ValueError):
                  raise Failure("transport")

          try:
              repo = os.environ.get("INPUT_REPO", "")
              runner_repo = os.environ.get("GITHUB_REPOSITORY", "")
              asset_id_text = os.environ.get("INPUT_ASSET_ID", "")
              asset_name = os.environ.get("INPUT_ASSET_NAME", "")
              size_text = os.environ.get("INPUT_ASSET_BYTES", "")
              expected_sha = os.environ.get("INPUT_ASSET_SHA256", "")
              token = os.environ.get("GITHUB_TOKEN", "")
              need(REPO.fullmatch(repo) is not None and repo == runner_repo, "repository")
              need(ID.fullmatch(asset_id_text) is not None, "asset_id")
              need(NAME.fullmatch(asset_name) is not None, "asset_name")
              try:
                  expected_size = int(size_text)
              except ValueError:
                  raise Failure("asset_bytes")
              need(1 <= expected_size <= MAX, "asset_bytes")
              need(SHA.fullmatch(expected_sha) is not None, "asset_sha256")
              need(token != "" and not re.search(r"\s", token), "token")
              owner, project = repo.split("/", 1)
              path = "/repos/{}/{}/releases/assets/{}".format(
                  urllib.parse.quote(owner, safe=""),
                  urllib.parse.quote(project, safe=""),
                  urllib.parse.quote(asset_id_text, safe=""),
              )
              url = "https://" + API + path
              asset_bytes, body_redirects = get_asset(url, token, "application/octet-stream", MAX)
              need(len(asset_bytes) == expected_size, "body_size")
              actual_sha = hashlib.sha256(asset_bytes).hexdigest()
              need(actual_sha == expected_sha, "body_sha256")
              print(json.dumps({
                  "schema": "github-token-release-asset-capability-v1",
                  "success": True,
                  "python": "{}.{}.{}".format(*sys.version_info[:3]),
                  "assetId": int(asset_id_text),
                  "assetName": asset_name,
                  "bytes": expected_size,
                  "sha256": actual_sha,
                  "metadataRequested": False,
                  "bodyRedirects": body_redirects,
                  "authorization": "contents:write; GET-only",
                  "releaseEnumeration": False,
                  "mutation": False,
              }, sort_keys=True, separators=(",", ":")))
          except (Failure, UnicodeDecodeError, json.JSONDecodeError) as exc:
              print(json.dumps({
                  "schema": "github-token-release-asset-capability-v1",
                  "success": False,
                  "reason": str(exc),
                  "mutation": False,
              }, sort_keys=True, separators=(",", ":")), file=sys.stderr)
              raise SystemExit(2)
          except Exception:
              print(json.dumps({
                  "schema": "github-token-release-asset-capability-v1",
                  "success": False,
                  "reason": "internal",
                  "mutation": False,
              }, sort_keys=True, separators=(",", ":")), file=sys.stderr)
              raise SystemExit(2)
          PY
