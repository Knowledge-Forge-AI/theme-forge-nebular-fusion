name: Nebular N0 permission bootstrap v3 (temporary review branch)

# Proposal only. The override is step-local to the bootstrap Cargo invocation.
on:
  push:
    branches:
      - native-activation-owner-prep1/n0-permission-bootstrap-v3
    paths:
      - ".github/workflows/native-n0-permission-bootstrap-v3.yml"
      - "src-tauri/**"
      - "rust-toolchain.toml"
      - "package-lock.json"
      - "tools/n0-permission-bootstrap-config.mjs"
      - "tools/n0-generated-permission-baseline-v3.json"
      - "tools/clean-n0-generated-permissions-v3.mjs"
      - "tools/validate-n0-permissions-v3.mjs"

permissions:
  contents: read

concurrency:
  group: nebular-n0-permission-bootstrap-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    name: Generate exactly 54 Tauri permissions (N0 v3 bootstrap only)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      N0_NODE_VERSION: "22.23.4"
      N0_RUST_VERSION: "1.98.0"
      N0_TARGET: aarch64-apple-darwin
      N0_EXPECTED_ORIGINAL_CONFIG_SHA256: "9976b9b3f2c68c5e96ad9ceb161841089e515930c967a08e1b6a8b0e388b6a49"
      N0_EXPECTED_CONFIG_SHA256: "273906ce80048ba12b90eda325396cff544ab74385b4bcfc807e52c7902dd7b6"
    steps:
      - name: Check out the exact temporary review-branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind the pushed source commit, tree, and actual host
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/native-activation-owner-prep1/n0-permission-bootstrap-v3"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test -n "$(git rev-parse 'HEAD^{tree}')"
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          test -z "${TAURI_CONFIG:-}"

      - name: Select the inherited Node 22.23.4 runtime
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0; inherited from native-rc.yml
        with:
          node-version: 22.23.4

      - name: Allocate fresh runner-owned N0 v3 homes
        shell: bash
        run: |
          set -euo pipefail
          N0_ROOT="${RUNNER_TEMP}/theme-forge-n0-v3-${GITHUB_RUN_ID}"
          umask 077
          mkdir -p "$N0_ROOT/rustup" "$N0_ROOT/cargo-home" "$N0_ROOT/target" "$N0_ROOT/upload/permissions"
          chmod 700 "$N0_ROOT" "$N0_ROOT/rustup" "$N0_ROOT/cargo-home" "$N0_ROOT/target" "$N0_ROOT/upload" "$N0_ROOT/upload/permissions"

      - name: Select the inherited repository-pinned Rust 1.98.0 toolchain
        shell: bash
        run: |
          set -euo pipefail
          N0_ROOT="${RUNNER_TEMP}/theme-forge-n0-v3-${GITHUB_RUN_ID}"
          export RUSTUP_HOME="$N0_ROOT/rustup"
          export CARGO_HOME="$N0_ROOT/cargo-home"
          test "$(sed -nE 's/^channel = \"([^\"]+)\"$/\1/p' rust-toolchain.toml | head -n 1)" = "$N0_RUST_VERSION"
          rustup toolchain install "$N0_RUST_VERSION" --profile minimal
          rustup component add rustfmt clippy --toolchain "$N0_RUST_VERSION"
          RUSTUP_TOOLCHAIN="$N0_RUST_VERSION" rustc --version | grep '^rustc 1.98.0 '
          RUSTUP_TOOLCHAIN="$N0_RUST_VERSION" cargo --version | grep '^cargo 1.98.0 '

      - name: Verify bounded inputs and clear any inherited override
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          test -s src-tauri/Cargo.toml
          test -s src-tauri/Cargo.lock
          test -s src-tauri/tauri.conf.json
          test -s rust-toolchain.toml
          test -s tools/n0-generated-permission-baseline-v3.json
          test -s tools/clean-n0-generated-permissions-v3.mjs
          test -z "${NEBULAR_BUILD_MODE:-}"
          test -z "${TAURI_CONFIG:-}"

      - name: Remove only hash-bound checked-in permission outputs
        shell: bash
        run: |
          set -euo pipefail
          node tools/clean-n0-generated-permissions-v3.mjs --root "$GITHUB_WORKSPACE"
          test "$(find src-tauri/permissions/autogenerated -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')" = "0"

      - name: Run bootstrap Cargo check with step-local TAURI_CONFIG merge override
        shell: bash
        run: |
          set -euo pipefail
          N0_ROOT="${RUNNER_TEMP}/theme-forge-n0-v3-${GITHUB_RUN_ID}"
          export RUSTUP_HOME="$N0_ROOT/rustup"
          export CARGO_HOME="$N0_ROOT/cargo-home"
          export CARGO_TARGET_DIR="$N0_ROOT/target"
          export RUSTUP_TOOLCHAIN="$N0_RUST_VERSION"
          TAURI_CONFIG_JSON="$(node tools/n0-permission-bootstrap-config.mjs --print-json)"
          TAURI_CONFIG_SHA256="$(node tools/n0-permission-bootstrap-config.mjs --print-sha256)"
          test "$TAURI_CONFIG_SHA256" = "$N0_EXPECTED_CONFIG_SHA256"
          export TAURI_CONFIG="$TAURI_CONFIG_JSON"
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target "$N0_TARGET"
          cargo check --locked --manifest-path src-tauri/Cargo.toml --target "$N0_TARGET" --all-targets --all-features
          unset TAURI_CONFIG
          test -z "${TAURI_CONFIG:-}"

      - name: Validate measured runtime, bootstrap identity, and exact generated set
        shell: bash
        run: |
          set -euo pipefail
          N0_ROOT="${RUNNER_TEMP}/theme-forge-n0-v3-${GITHUB_RUN_ID}"
          export RUSTUP_HOME="$N0_ROOT/rustup"
          export CARGO_HOME="$N0_ROOT/cargo-home"
          export RUSTUP_TOOLCHAIN="$N0_RUST_VERSION"
          NODE_ACTUAL_VERSION="$(node -p 'process.versions.node')"
          test "$NODE_ACTUAL_VERSION" = "$N0_NODE_VERSION"
          test -z "${TAURI_CONFIG:-}"
          node tools/validate-n0-permissions-v3.mjs \
            --root "$GITHUB_WORKSPACE" \
            --source-commit "$GITHUB_SHA" \
            --source-tree "$(git rev-parse 'HEAD^{tree}')" \
            --node-version "$NODE_ACTUAL_VERSION" \
            --rust-version "$(RUSTUP_TOOLCHAIN="$N0_RUST_VERSION" rustc --version)" \
            --cargo-version "$(RUSTUP_TOOLCHAIN="$N0_RUST_VERSION" cargo --version)" \
            --bootstrap-check-succeeded true \
            --expect-original-config-sha256 "$N0_EXPECTED_ORIGINAL_CONFIG_SHA256" \
            --expect-config-sha256 "$N0_EXPECTED_CONFIG_SHA256" \
            --receipt "$N0_ROOT/n0-receipt.json"

      - name: Stage only the 54 validated TOMLs and bounded v3 receipt
        shell: bash
        run: |
          set -euo pipefail
          N0_ROOT="${RUNNER_TEMP}/theme-forge-n0-v3-${GITHUB_RUN_ID}"
          test "$(find src-tauri/permissions/autogenerated -maxdepth 1 -type f -name '*.toml' | wc -l | tr -d ' ')" = "54"
          cp src-tauri/permissions/autogenerated/*.toml "$N0_ROOT/upload/permissions/"
          cp "$N0_ROOT/n0-receipt.json" "$N0_ROOT/upload/"
          test "$(find "$N0_ROOT/upload/permissions" -maxdepth 1 -type f -name '*.toml' | wc -l | tr -d ' ')" = "54"
          test "$(find "$N0_ROOT/upload" -type f | wc -l | tr -d ' ')" = "55"

      - name: Upload only the 54 validated TOMLs and bounded v3 receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nebular-n0-permissions-v3-${{ github.sha }}
          path: |
            ${{ runner.temp }}/theme-forge-n0-v3-${{ github.run_id }}/upload/permissions/*.toml
            ${{ runner.temp }}/theme-forge-n0-v3-${{ github.run_id }}/upload/n0-receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
